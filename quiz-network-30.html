<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แนวข้อสอบเครือข่ายคอมพิวเตอร์ (Network) 30 ข้อ</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card-bg: #ffffff;
    --text: #1f2430;
    --muted: #667085;
    --primary: #2d5cf6;
    --correct: #1a9d5a;
    --incorrect: #e5484d;
    --border: #e3e7ee;
    --header-bg: #1c2333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Sarabun", "TH Sarabun New", "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 60px;
  }
  header {
    background: var(--header-bg);
    color: #fff;
    padding: 22px 20px;
    text-align: center;
  }
  header .back-row { text-align: left; max-width: 800px; margin: 0 auto 12px; }
  header .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: #b9c0d4; text-decoration: none; font-size: 0.85rem;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 999px; padding: 6px 13px;
  }
  header .back-link:hover { color: #fff; border-color: #fff; }
  header h1 { margin: 0 0 6px; font-size: 1.5rem; }
  header p { margin: 0; color: #b9c0d4; font-size: 0.95rem; }

  .container { max-width: 800px; margin: 0 auto; padding: 20px; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .toolbar button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .toolbar button.secondary {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  #score-box {
    font-weight: 600;
    color: var(--muted);
  }
  #score-box span { color: var(--primary); font-size: 1.1rem; }

  .question-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .q-number {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    font-weight: 600;
    font-size: 0.8rem;
    padding: 2px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .q-prompt { font-size: 1.02rem; font-weight: 600; margin: 0 0 12px; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .option:hover { background: #f0f3fc; }
  .option input { margin-top: 3px; }
  .option.correct { border-color: var(--correct); background: #eafaf1; }
  .option.incorrect { border-color: var(--incorrect); background: #fdeeee; }
  .option.disabled { pointer-events: none; }

  .explanation {
    display: none;
    margin-top: 12px;
    padding: 10px 14px;
    background: #f4f6fa;
    border-left: 4px solid var(--primary);
    border-radius: 6px;
    font-size: 0.92rem;
    color: var(--muted);
  }
  .explanation.show { display: block; }
  .explanation b { color: var(--text); }

  .verdict {
    display: none;
    font-weight: 700;
    margin-top: 10px;
    font-size: 0.95rem;
  }
  .verdict.correct-v { color: var(--correct); display: block; }
  .verdict.incorrect-v { color: var(--incorrect); display: block; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 20px;
  }

  #result-summary {
    display: none;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  #result-summary.show { display: block; }
  #result-summary .big-score { font-size: 2.2rem; font-weight: 700; color: var(--primary); }
</style>
</head>
<body>

<header>
  <div class="back-row"><a class="back-link" href="quiz.html">‹ กลับหน้าแบบทดสอบ</a></div>
  <h1>แนวข้อสอบเครือข่ายคอมพิวเตอร์ (Network)</h1>
  <p>30 ข้อ พร้อมเฉลยและคำอธิบาย — สำหรับเตรียมสอบสายงาน IT</p>
</header>

<div class="container">
  <div class="toolbar">
    <div id="score-box">ตอบแล้ว <span id="answered-count">0</span>/30</div>
    <div>
      <button class="secondary" onclick="resetQuiz()">เริ่มใหม่</button>
      <button onclick="checkAll()">ตรวจทั้งหมด</button>
    </div>
  </div>

  <div id="result-summary">
    <div>คะแนนของคุณ</div>
    <div class="big-score"><span id="final-score">0</span> / 30</div>
  </div>

  <div id="quiz-root"></div>
</div>

<footer>สร้างขึ้นเพื่อการฝึกทบทวนเท่านั้น ไม่ใช่ข้อสอบจริงของศาลยุติธรรม</footer>

<script>
const questions = [
  {q:"โมเดล OSI แบ่งการทำงานออกเป็นกี่ชั้น (Layer)", options:["5 ชั้น","6 ชั้น","7 ชั้น","8 ชั้น"], correct:2, explain:"โมเดล OSI (Open Systems Interconnection) แบ่งเป็น 7 ชั้น ได้แก่ Physical, Data Link, Network, Transport, Session, Presentation, Application"},
  {q:"ชั้นใดของ OSI ทำหน้าที่กำหนดเส้นทางการส่งข้อมูล (Routing) และการกำหนดที่อยู่ IP", options:["Data Link Layer","Network Layer","Transport Layer","Session Layer"], correct:1, explain:"Network Layer (Layer 3) รับผิดชอบการหาเส้นทาง (routing) และการระบุที่อยู่แบบลอจิคัล เช่น IP Address"},
  {q:"อุปกรณ์ที่ทำงานหลักอยู่ใน Data Link Layer และใช้ MAC Address ในการส่งข้อมูล คืออุปกรณ์ใด", options:["Router","Switch","Repeater","Modem"], correct:1, explain:"Switch ทำงานที่ Layer 2 โดยอ้างอิง MAC Address ในการส่งเฟรมข้อมูลไปยังพอร์ตปลายทางที่ถูกต้อง"},
  {q:"โปรโตคอลใดใช้สำหรับแปลงชื่อโดเมน (Domain Name) ให้เป็นหมายเลข IP Address", options:["DHCP","DNS","FTP","SNMP"], correct:1, explain:"DNS (Domain Name System) ทำหน้าที่แปลงชื่อโดเมนที่มนุษย์อ่านง่ายให้เป็นหมายเลข IP Address ที่คอมพิวเตอร์ใช้สื่อสาร"},
  {q:"โปรโตคอลใดทำหน้าที่แจกจ่ายหมายเลข IP Address ให้กับเครื่องลูกข่ายโดยอัตโนมัติ", options:["DHCP","DNS","HTTP","ARP"], correct:0, explain:"DHCP (Dynamic Host Configuration Protocol) ใช้แจกจ่าย IP Address, Subnet Mask, Gateway และ DNS ให้เครื่องในเครือข่ายโดยอัตโนมัติ"},
  {q:"IP Address รุ่น IPv4 มีความยาวกี่บิต", options:["16 บิต","32 บิต","64 บิต","128 บิต"], correct:1, explain:"IPv4 มีความยาว 32 บิต แบ่งเป็น 4 ชุด ชุดละ 8 บิต (เช่น 192.168.1.1) ส่วน IPv6 มีความยาว 128 บิต"},
  {q:"ที่อยู่ IP Address ในช่วง 192.168.0.0 - 192.168.255.255 จัดอยู่ใน Class ใด และเป็น Private IP หรือไม่", options:["Class A, Public IP","Class B, Private IP","Class C, Private IP","Class D, Public IP"], correct:2, explain:"192.168.x.x อยู่ใน Class C และเป็นช่วง Private IP Address ที่กำหนดไว้สำหรับใช้งานภายในองค์กร ไม่สามารถใช้บน Internet โดยตรง"},
  {q:"Subnet Mask เริ่มต้นของ IP Class C คือข้อใด", options:["255.0.0.0","255.255.0.0","255.255.255.0","255.255.255.255"], correct:2, explain:"Class C ใช้ 24 บิตแรกเป็น Network ID จึงมี Subnet Mask เริ่มต้นคือ 255.255.255.0 หรือ /24"},
  {q:"อุปกรณ์ที่ทำหน้าที่เชื่อมต่อเครือข่ายต่างวง (network ต่างกัน) เข้าด้วยกัน และเลือกเส้นทางส่งข้อมูล คืออุปกรณ์ใด", options:["Hub","Switch","Router","Bridge"], correct:2, explain:"Router ทำงานที่ Layer 3 มีหน้าที่เชื่อมต่อเครือข่ายที่ต่างวงกันและเลือกเส้นทาง (routing) ที่ดีที่สุดในการส่งข้อมูล"},
  {q:"ข้อใดคือความแตกต่างหลักระหว่าง Hub และ Switch", options:["Hub ส่งข้อมูลไปทุกพอร์ต ส่วน Switch ส่งเฉพาะพอร์ตปลายทางตาม MAC Address","Hub เร็วกว่า Switch เสมอ","Switch ใช้สายไฟเบอร์เท่านั้น","Hub และ Switch ทำงานเหมือนกันทุกประการ"], correct:0, explain:"Hub กระจายสัญญาณ (broadcast) ไปทุกพอร์ตโดยไม่แยกแยะ ทำให้เกิดการชนกันของข้อมูลได้ง่าย ส่วน Switch จะส่งข้อมูลเฉพาะพอร์ตปลายทางตาม MAC Address ทำให้มีประสิทธิภาพสูงกว่า"},
  {q:"โปรโตคอลชั้น Transport ที่มีการยืนยันการรับส่งข้อมูล (connection-oriented) เชื่อถือได้ คือข้อใด", options:["UDP","TCP","ICMP","ARP"], correct:1, explain:"TCP (Transmission Control Protocol) เป็นแบบ connection-oriented มีการตรวจสอบและยืนยันการรับส่งข้อมูล (three-way handshake) ทำให้ข้อมูลถึงปลายทางครบถ้วน"},
  {q:"โปรโตคอลใดเน้นความเร็วมากกว่าความน่าเชื่อถือ ไม่มีการยืนยันการรับส่งข้อมูล เหมาะกับงานสตรีมมิ่งหรือวิดีโอคอล", options:["TCP","FTP","UDP","HTTP"], correct:2, explain:"UDP (User Datagram Protocol) เป็นแบบ connectionless ไม่มีการยืนยันข้อมูล ทำให้ส่งข้อมูลได้เร็ว เหมาะกับงานที่ต้องการความเร็วมากกว่าความสมบูรณ์ เช่น สตรีมมิ่ง วิดีโอคอล"},
  {q:"หมายเลขพอร์ต (Port) มาตรฐานของโปรโตคอล HTTP คือข้อใด", options:["Port 21","Port 25","Port 80","Port 443"], correct:2, explain:"HTTP ใช้ Port 80 เป็นมาตรฐาน ส่วน HTTPS (HTTP แบบเข้ารหัส) ใช้ Port 443"},
  {q:"โปรโตคอลใดใช้สำหรับโอนย้ายไฟล์ระหว่างเครื่องคอมพิวเตอร์ผ่านเครือข่าย", options:["SMTP","FTP","DNS","SNMP"], correct:1, explain:"FTP (File Transfer Protocol) ใช้สำหรับอัปโหลดและดาวน์โหลดไฟล์ระหว่างเครื่องคอมพิวเตอร์บนเครือข่าย มาตรฐานใช้ Port 21"},
  {q:"โปรโตคอลใดใช้สำหรับส่งอีเมลออกจากเครื่องผู้ส่งไปยังเซิร์ฟเวอร์ปลายทาง", options:["POP3","IMAP","SMTP","HTTP"], correct:2, explain:"SMTP (Simple Mail Transfer Protocol) ใช้สำหรับส่งอีเมล ส่วน POP3 และ IMAP ใช้สำหรับรับ/ดึงอีเมลจากเซิร์ฟเวอร์"},
  {q:"เครือข่ายที่ครอบคลุมพื้นที่ในอาคารหรือองค์กรเดียวกัน เรียกว่าอะไร", options:["WAN","LAN","MAN","PAN"], correct:1, explain:"LAN (Local Area Network) คือเครือข่ายที่ครอบคลุมพื้นที่จำกัด เช่น ภายในอาคารหรือสำนักงานเดียวกัน"},
  {q:"เครือข่ายที่เชื่อมต่อครอบคลุมระยะทางไกลระหว่างเมืองหรือประเทศ เรียกว่าอะไร", options:["LAN","WAN","WLAN","VLAN"], correct:1, explain:"WAN (Wide Area Network) คือเครือข่ายที่ครอบคลุมระยะทางไกล เชื่อมต่อระหว่างเมืองหรือประเทศ ตัวอย่างที่ใหญ่ที่สุดคือ อินเทอร์เน็ต"},
  {q:"โทโพโลยีเครือข่ายแบบใดที่อุปกรณ์ทุกเครื่องเชื่อมต่อเข้ากับอุปกรณ์ศูนย์กลาง (เช่น Switch) เพียงจุดเดียว", options:["Bus Topology","Ring Topology","Star Topology","Mesh Topology"], correct:2, explain:"Star Topology คือโทโพโลยีที่อุปกรณ์ทุกเครื่องเชื่อมต่อเข้ากับจุดศูนย์กลาง (Hub/Switch) หากสายใดสายหนึ่งขาด เครื่องอื่นยังทำงานได้ เป็นรูปแบบที่นิยมใช้ในปัจจุบัน"},
  {q:"โทโพโลยีเครือข่ายแบบ Bus มีข้อเสียหลักคือข้อใด", options:["ใช้สายมากเกินความจำเป็น","หากสายหลัก (Backbone) เสียหาย เครือข่ายทั้งหมดจะล่ม","ไม่สามารถเพิ่มเครื่องใหม่ได้เลย","ต้องใช้ Router เท่านั้น"], correct:1, explain:"Bus Topology ใช้สายหลักเส้นเดียวเชื่อมทุกอุปกรณ์ หากสายหลักขาดหรือเสียหาย เครือข่ายทั้งระบบจะหยุดทำงานทันที"},
  {q:"สาย UTP (Unshielded Twisted Pair) ที่นิยมใช้ในระบบ LAN ปัจจุบัน รองรับความเร็ว 1 Gbps ขึ้นไป มักเป็น Category ใด", options:["Cat 3","Cat 5","Cat 5e / Cat 6","Cat 1"], correct:2, explain:"สาย UTP Category 5e และ Category 6 รองรับความเร็วระดับ Gigabit (1 Gbps ขึ้นไป) ซึ่งเป็นมาตรฐานที่ใช้กันแพร่หลายในปัจจุบัน"},
  {q:"ข้อใดคือข้อดีหลักของสายไฟเบอร์ออปติก (Fiber Optic) เมื่อเทียบกับสายทองแดง", options:["ราคาถูกกว่าเสมอ","ส่งข้อมูลได้ระยะไกลกว่าและไม่ถูกรบกวนจากสัญญาณไฟฟ้า","ติดตั้งง่ายกว่าสายทองแดงมาก","ไม่ต้องใช้อุปกรณ์แปลงสัญญาณ"], correct:1, explain:"สายไฟเบอร์ออปติกใช้แสงในการส่งข้อมูล จึงส่งได้ระยะไกลกว่า ความเร็วสูงกว่า และไม่ถูกรบกวนจากคลื่นแม่เหล็กไฟฟ้า (EMI) เมื่อเทียบกับสายทองแดง"},
  {q:"NAT (Network Address Translation) มีหน้าที่หลักคือข้อใด", options:["เข้ารหัสข้อมูลระหว่างการส่ง","แปลง Private IP ภายในองค์กรให้เป็น Public IP เมื่อออกสู่อินเทอร์เน็ต","แจกจ่ายหมายเลข IP อัตโนมัติ","ตรวจจับไวรัสในเครือข่าย"], correct:1, explain:"NAT ทำหน้าที่แปลง Private IP Address ภายในเครือข่ายให้เป็น Public IP Address เดียว เมื่อต้องการติดต่อสื่อสารกับอินเทอร์เน็ตภายนอก ช่วยประหยัด IP และเพิ่มความปลอดภัย"},
  {q:"Firewall มีหน้าที่หลักคือข้อใด", options:["เพิ่มความเร็วอินเทอร์เน็ต","กรองและควบคุมการเข้า-ออกของข้อมูลตามนโยบายความปลอดภัยที่กำหนด","แปลงชื่อโดเมนเป็น IP","จัดเก็บสำรองข้อมูล"], correct:1, explain:"Firewall เป็นระบบรักษาความปลอดภัยที่ทำหน้าที่กรอง ตรวจสอบ และควบคุมการรับส่งข้อมูลเข้า-ออกเครือข่าย ตามกฎ (policy) ที่กำหนดไว้ เพื่อป้องกันการเข้าถึงที่ไม่ได้รับอนุญาต"},
  {q:"VPN (Virtual Private Network) มีประโยชน์หลักคือข้อใด", options:["เพิ่มความเร็วอินเทอร์เน็ตให้เร็วขึ้นเสมอ","สร้างช่องทางสื่อสารที่เข้ารหัสและปลอดภัยผ่านเครือข่ายสาธารณะ","ใช้แทน Router ได้ทั้งหมด","เป็นอุปกรณ์กระจายสัญญาณ Wi-Fi"], correct:1, explain:"VPN สร้างอุโมงค์ (tunnel) การสื่อสารที่เข้ารหัสผ่านเครือข่ายสาธารณะ เช่น อินเทอร์เน็ต ทำให้สามารถเข้าถึงเครือข่ายภายในองค์กรได้อย่างปลอดภัยจากระยะไกล"},

  {q:"คำสั่งใดในระบบปฏิบัติการ ใช้ตรวจสอบว่าเครื่องปลายทางสามารถติดต่อสื่อสารได้หรือไม่ (ตรวจสอบการเชื่อมต่อพื้นฐาน)", options:["ping","format","chkdsk","copy"], correct:0, explain:"คำสั่ง ping ใช้ส่งแพ็กเก็ตทดสอบ (ICMP Echo Request) ไปยังเครื่องปลายทางเพื่อตรวจสอบว่าเครือข่ายเชื่อมต่อถึงกันได้หรือไม่"},

const userAnswers = new Array(questions.length).fill(null);
const answeredLocked = new Array(questions.length).fill(false);

const root = document.getElementById('quiz-root');

function render() {
  root.innerHTML = '';
  questions.forEach((item, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';

    const num = document.createElement('div');
    num.className = 'q-number';
    num.textContent = 'ข้อ ' + (qi + 1) + ' / ' + questions.length;
    card.appendChild(num);

    const prompt = document.createElement('p');
    prompt.className = 'q-prompt';
    prompt.textContent = item.q;
    card.appendChild(prompt);

    const optWrap = document.createElement('div');
    optWrap.className = 'options';

    item.options.forEach((optText, oi) => {
      const label = document.createElement('label');
      label.className = 'option';
      label.id = 'opt-' + qi + '-' + oi;

      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + qi;
      input.value = oi;
      input.onchange = () => selectAnswer(qi, oi);

      const span = document.createElement('span');
      span.textContent = optText;

      label.appendChild(input);
      label.appendChild(span);
      optWrap.appendChild(label);
    });

    card.appendChild(optWrap);

    const verdict = document.createElement('div');
    verdict.className = 'verdict';
    verdict.id = 'verdict-' + qi;
    card.appendChild(verdict);

    const explain = document.createElement('div');
    explain.className = 'explanation';
    explain.id = 'explain-' + qi;
    explain.innerHTML = '<b>เฉลย: </b>' + item.options[item.correct] + '<br>' + item.explain;
    card.appendChild(explain);

    root.appendChild(card);
  });
  updateScoreBox();
}

function selectAnswer(qi, oi) {
  if (answeredLocked[qi]) return;
  userAnswers[qi] = oi;
  lockQuestion(qi);
}

function lockQuestion(qi) {
  answeredLocked[qi] = true;
  const item = questions[qi];
  const chosen = userAnswers[qi];

  item.options.forEach((_, oi) => {
    const label = document.getElementById('opt-' + qi + '-' + oi);
    label.classList.add('disabled');
    if (oi === item.correct) label.classList.add('correct');
    if (oi === chosen && chosen !== item.correct) label.classList.add('incorrect');
  });

  const verdict = document.getElementById('verdict-' + qi);
  if (chosen === item.correct) {
    verdict.textContent = '✓ ถูกต้อง';
    verdict.className = 'verdict correct-v';
  } else {
    verdict.textContent = '✗ ยังไม่ถูก';
    verdict.className = 'verdict incorrect-v';
  }

  document.getElementById('explain-' + qi).classList.add('show');
  updateScoreBox();
}

function checkAll() {
  questions.forEach((_, qi) => {
    if (!answeredLocked[qi]) {
      const checked = document.querySelector('input[name="q' + qi + '"]:checked');
      if (checked) {
        userAnswers[qi] = parseInt(checked.value);
      }
      lockQuestion(qi);
    }
  });
  showSummary();
}

function updateScoreBox() {
  const answeredCount = answeredLocked.filter(Boolean).length;
  document.getElementById('answered-count').textContent = answeredCount;
}

function showSummary() {
  let score = 0;
  questions.forEach((item, qi) => {
    if (userAnswers[qi] === item.correct) score++;
  });
  document.getElementById('final-score').textContent = score;
  document.getElementById('result-summary').classList.add('show');
  document.getElementById('result-summary').scrollIntoView({behavior: 'smooth'});
  saveQuizScore(score, questions.length);
}

/* ---------- ส่งคะแนนกลับไปให้หน้า quiz.html แสดงสรุป ----------
   ไฟล์ควิซทุกไฟล์ในระบบนี้เรียกฟังก์ชันนี้เหมือนกัน — id จะดึงจากชื่อไฟล์ตัวเองอัตโนมัติ
   (ต้องตรงกับ id ที่ประกาศไว้ใน QUIZ_SETS ของ quiz.html ซึ่งปกติจะตรงกันเองเพราะใช้ชื่อไฟล์เดียวกัน) */
function saveQuizScore(score, total) {
  try {
    const id = location.pathname.split('/').pop().replace(/\.html$/, '');
    const key = 'quiz_scores_v1';
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    const prev = all[id] || {};
    all[id] = {
      score, total,
      at: Date.now(),
      best: Math.max(score, prev.best || 0),
      bestTotal: total,
      attempts: (prev.attempts || 0) + 1,
    };
    localStorage.setItem(key, JSON.stringify(all));
  } catch (e) {}
}

function resetQuiz() {
  userAnswers.fill(null);
  answeredLocked.fill(false);
  document.getElementById('result-summary').classList.remove('show');
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

render();
</script>
