<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>TRADE JOURNAL</title>
<style>
  :root {
    --bg: #0a0d11;
    --panel: #11151b;
    --panel-2: #161b22;
    --line: #232a33;
    --text: #e6e9ed;
    --muted: #7c8794;
    --accent: #e8a33d;
    --bull: #34c77b;
    --bear: #e5484d;
    --neutral: #d9a441;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 18px;
    padding-bottom: 60px;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; }
  .header { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .brand .dot { color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .back-link { background: transparent; border: 1px solid var(--line); color: var(--text); padding: 8px 14px; border-radius: 4px; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; }
  .back-link:hover { border-color: var(--accent); color: var(--accent); }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 7px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: ui-monospace, monospace; letter-spacing: 0.3px; }
  .tab-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(232,163,61,0.08); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 14px; }
  .panel h3 { margin: 0 0 12px 0; font-size: 13px; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 8px 10px; border-radius: 4px; font-size: 13px; font-family: inherit; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { resize: vertical; }
  button.primary { background: var(--accent); color: #14110a; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 13px; }
  button.primary:hover { opacity: 0.9; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button.ghost:hover { border-color: var(--accent); }
  button.ghost.danger:hover { border-color: var(--bear); color: var(--bear); }
  .icon-btn { background: transparent; border: 1px solid var(--line); color: var(--text); width: 32px; height: 32px; border-radius: 4px; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .field { margin-bottom: 10px; flex: 1; min-width: 140px; }
  label.small { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); font-size: 13px; padding: 30px; text-align: center; }

  /* metrics */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .metric { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 10px; }
  .metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .metric-value { font-family: ui-monospace, monospace; font-size: 17px; font-weight: 700; }
  .metric-value.pos { color: var(--bull); }
  .metric-value.neg { color: var(--bear); }

  /* calendar */
  .calendar-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .calendar-nav { display: flex; align-items: center; gap: 10px; }
  .calendar-month-label { font-size: 17px; font-weight: 700; min-width: 150px; text-align: center; }
  .calendar-total { font-size: 15px; }
  .calendar-total .mono { font-weight: 800; font-size: 17px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .calendar-dow { font-size: 11px; color: var(--muted); text-transform: uppercase; text-align: center; padding-bottom: 4px; }
  .calendar-day { min-height: 82px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--panel-2); display: flex; flex-direction: column; }
  .calendar-day.other-month { opacity: 0.3; }
  .calendar-day.has-trades { cursor: pointer; }
  .calendar-day.has-trades:hover { border-color: var(--accent); }
  .calendar-day.profit { background: rgba(52,199,123,0.10); border-color: rgba(52,199,123,0.35); }
  .calendar-day.loss { background: rgba(229,72,77,0.10); border-color: rgba(229,72,77,0.35); }
  .calendar-day.today { box-shadow: 0 0 0 2px var(--accent) inset; }
  .calendar-day-num { font-size: 11px; color: var(--muted); }
  .calendar-day-pnl { font-family: ui-monospace, monospace; font-weight: 800; font-size: 13px; margin-top: 4px; }
  .calendar-day-pnl.pos { color: var(--bull); }
  .calendar-day-pnl.neg { color: var(--bear); }
  .calendar-day-count { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .calendar-day-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; padding-top: 4px; }
  .calendar-tag { font-size: 8.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; color: var(--muted); white-space: nowrap; }
  @media (max-width: 720px) {
    .calendar-day { min-height: 58px; padding: 4px 5px; }
    .calendar-day-tags, .calendar-day-num { display: none; }
    .calendar-day-pnl { font-size: 11px; margin-top: 2px; }
  }

  /* charts */
  .chart-wrap { overflow-x: auto; }
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 190px; padding-top: 10px; }
  .bar-col { flex: 1; min-width: 26px; display: flex; flex-direction: column; align-items: center; height: 100%; }
  .bar-track { width: 100%; height: 140px; display: flex; align-items: flex-end; }
  .bar-fill { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; }
  .bar-fill.pos { background: var(--bull); }
  .bar-fill.neg { background: var(--bear); }
  .bar-label { font-size: 9.5px; color: var(--muted); margin-top: 6px; white-space: nowrap; }
  .bar-value { font-size: 9.5px; margin-top: 2px; white-space: nowrap; }
  .bar-value.pos { color: var(--bull); }
  .bar-value.neg { color: var(--bear); }

  /* table */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 600; }
  tr.trade-row { cursor: pointer; }
  tr.trade-row:hover td { background: var(--panel-2); }
  .badge { padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; font-family: ui-monospace, monospace; display: inline-block; }
  .badge.up { color: var(--bull); border: 1px solid var(--bull); }
  .badge.down { color: var(--bear); border: 1px solid var(--bear); }
  .badge.market { color: var(--accent); border: 1px solid var(--accent); }
  .tag-chip { font-size: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; margin-right: 3px; display: inline-block; color: var(--muted); }

  /* modal */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; align-items: center; justify-content: center; padding: 16px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 20px 22px; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .modal-header h2 { font-size: 16px; margin: 0; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  .modal-footer .spacer { flex: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="brand"><span class="dot">●</span> TRADE<span class="dot">/</span>JOURNAL</div>
  <div class="row">
    <a href="index.html" class="back-link">← ทบทวน Elliott Wave</a>
    <a href="stock-decision-terminal.html" class="back-link">STOCK/DECIDE</a>
    <button class="ghost" id="exportBtn">⬇ ส่งออกข้อมูล</button>
    <button class="ghost" id="importBtn">⬆ นำเข้าข้อมูล</button>
    <input type="file" id="importInput" accept="application/json" hidden>
    <button class="primary" id="addTradeBtn">+ เพิ่มเทรด</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="calendar">[1] ปฏิทิน</button>
  <button class="tab-btn" data-tab="overview">[2] ภาพรวม</button>
  <button class="tab-btn" data-tab="log">[3] บันทึกเทรด</button>
</div>

<!-- CALENDAR TAB -->
<div id="tab-calendar">
  <div class="panel">
    <div class="calendar-toolbar">
      <div class="calendar-nav">
        <button class="icon-btn" id="prevMonthBtn">‹</button>
        <div class="calendar-month-label" id="calMonthLabel"></div>
        <button class="icon-btn" id="nextMonthBtn">›</button>
        <button class="ghost" id="todayBtn">วันนี้</button>
      </div>
      <div class="calendar-total">รวมเดือนนี้ <span class="mono" id="calMonthTotal"></span></div>
    </div>
    <div class="calendar-grid" id="calendarDow"></div>
    <div class="calendar-grid" id="calendarGrid" style="margin-top:6px;"></div>
  </div>
</div>

<!-- OVERVIEW TAB -->
<div id="tab-overview" class="hidden">
  <div class="panel">
    <h3>สรุปสถิติทั้งหมด</h3>
    <div class="metrics-grid" id="statsGrid"></div>
  </div>
  <div class="panel">
    <h3>กราฟการเติบโต (Equity Curve)</h3>
    <div class="chart-wrap" id="equityChartWrap"></div>
  </div>
  <div class="panel">
    <h3>กำไร/ขาดทุนรายเดือน (12 เดือนล่าสุด)</h3>
    <div class="chart-wrap" id="monthlyChartWrap"></div>
  </div>
</div>

<!-- LOG TAB -->
<div id="tab-log" class="hidden">
  <div class="panel">
    <div class="row" style="justify-content:space-between;">
      <h3 style="margin:0;">บันทึกเทรดทั้งหมด</h3>
      <div class="row">
        <select id="logMarketFilter" style="width:auto;">
          <option value="">ทุกประเภทตลาด</option>
          <option value="forex">Forex</option>
          <option value="futures">Futures</option>
          <option value="other">อื่นๆ</option>
        </select>
        <button class="ghost hidden" id="logDateFilterClear"></button>
      </div>
    </div>
    <div id="logTableWrap" style="margin-top:10px;"></div>
  </div>
</div>

<!-- Add/Edit Trade Modal -->
<div id="tradeModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 id="tradeModalTitle">เพิ่มเทรดใหม่</h2>
      <button class="icon-btn" id="tradeModalClose">✕</button>
    </div>

    <div class="row">
      <div class="field">
        <label class="small">วันที่</label>
        <input type="date" id="tfDate">
      </div>
      <div class="field">
        <label class="small">ประเภทตลาด</label>
        <select id="tfMarketType">
          <option value="forex">Forex</option>
          <option value="futures">Futures</option>
          <option value="other">อื่นๆ (หุ้น/คริปโต)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label class="small" id="tfSymbolLabel">คู่เงิน</label>
        <input type="text" id="tfSymbol" placeholder="เช่น EUR/USD">
      </div>
      <div class="field">
        <label class="small">ทิศทาง</label>
        <select id="tfSide">
          <option value="long">Long / Buy</option>
          <option value="short">Short / Sell</option>
        </select>
      </div>
    </div>

    <div class="row" id="tfForexFields">
      <div class="field"><label class="small">ขนาดล็อต (Lot Size)</label><input type="number" id="tfLot" step="0.01" placeholder="เช่น 0.10"></div>
      <div class="field"><label class="small">จำนวน Pips</label><input type="number" id="tfPips" step="0.1" placeholder="เช่น 25"></div>
    </div>

    <div class="row hidden" id="tfFuturesFields">
      <div class="field"><label class="small">จำนวนสัญญา (Contracts)</label><input type="number" id="tfContracts" step="1" placeholder="เช่น 2"></div>
      <div class="field"><label class="small">จำนวน Points</label><input type="number" id="tfPoints" step="0.01" placeholder="เช่น 12.5"></div>
    </div>

    <div class="row">
      <div class="field"><label class="small">ราคาเข้า</label><input type="number" id="tfEntry" step="any"></div>
      <div class="field"><label class="small">ราคาออก</label><input type="number" id="tfExit" step="any"></div>
    </div>

    <div class="field">
      <label class="small">กำไร/ขาดทุน ($) *</label>
      <input type="number" id="tfPnl" step="any" placeholder="ใส่ค่าลบถ้าขาดทุน เช่น -45.50">
    </div>

    <div class="field">
      <label class="small">Setup / แท็ก (คั่นด้วยคอมมา)</label>
      <input type="text" id="tfTags" placeholder="เช่น BREAKOUT, FOMO, RSI CROSSED">
    </div>

    <div class="field">
      <label class="small">หมายเหตุ</label>
      <textarea id="tfNotes" rows="3"></textarea>
    </div>

    <div class="modal-footer">
      <button class="ghost danger hidden" id="tradeDeleteBtn">ลบเทรดนี้</button>
      <div class="spacer"></div>
      <button class="ghost" id="tradeCancelBtn">ยกเลิก</button>
      <button class="primary" id="tradeSaveBtn">บันทึก</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const LS_KEY = "tj_trades_v1";
  const MONTH_NAMES_TH = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  const MONTH_SHORT_TH = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const DOW_TH = ["อา","จ","อ","พ","พฤ","ศ","ส"];
  const MARKET_LABEL = { forex: "Forex", futures: "Futures", other: "อื่นๆ" };

  function loadTrades() {
    try {
      const parsed = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }
  function saveTrades() { localStorage.setItem(LS_KEY, JSON.stringify(trades)); }

  let trades = loadTrades();

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function dateKey(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }
  function todayKey() { const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }
  function escapeHtml(str) {
    return (str || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }
  function fmtMoney(n) {
    const v = Number(n) || 0;
    const sign = v > 0 ? "+" : "";
    return sign + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  /* ---------- tabs ---------- */
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });
  function switchTab(tab) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    document.getElementById("tab-calendar").classList.toggle("hidden", tab !== "calendar");
    document.getElementById("tab-overview").classList.toggle("hidden", tab !== "overview");
    document.getElementById("tab-log").classList.toggle("hidden", tab !== "log");
    if (tab === "overview") renderOverview();
    if (tab === "log") renderLog();
  }

  /* ---------- calendar ---------- */
  const today = new Date();
  let calYear = today.getFullYear();
  let calMonth = today.getMonth();

  const calendarDow = document.getElementById("calendarDow");
  DOW_TH.forEach(d => {
    const el = document.createElement("div");
    el.className = "calendar-dow";
    el.textContent = d;
    calendarDow.appendChild(el);
  });

  function tradesByDate() {
    const map = {};
    trades.forEach(t => {
      if (!map[t.date]) map[t.date] = [];
      map[t.date].push(t);
    });
    return map;
  }

  function renderCalendar() {
    document.getElementById("calMonthLabel").textContent = `${MONTH_NAMES_TH[calMonth]} ${calYear}`;
    const byDate = tradesByDate();
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const firstDow = new Date(calYear, calMonth, 1).getDay();
    const daysInThisMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

    let monthTotal = 0;
    const cells = [];

    for (let i = 0; i < firstDow; i++) {
      const d = daysInPrevMonth - firstDow + 1 + i;
      cells.push({ day: d, otherMonth: true });
    }
    for (let d = 1; d <= daysInThisMonth; d++) {
      cells.push({ day: d, otherMonth: false, key: dateKey(calYear, calMonth, d) });
    }
    while (cells.length % 7 !== 0) {
      cells.push({ day: cells.length - (firstDow + daysInThisMonth) + 1, otherMonth: true });
    }

    cells.forEach(cell => {
      const div = document.createElement("div");
      div.className = "calendar-day";
      if (cell.otherMonth) {
        div.classList.add("other-month");
        div.innerHTML = `<div class="calendar-day-num">${cell.day}</div>`;
        grid.appendChild(div);
        return;
      }
      const dayTrades = byDate[cell.key] || [];
      const dayTotal = dayTrades.reduce((s, t) => s + (Number(t.pnl) || 0), 0);
      if (cell.key === todayKey()) div.classList.add("today");
      if (dayTrades.length) {
        div.classList.add("has-trades");
        div.classList.add(dayTotal >= 0 ? "profit" : "loss");
        monthTotal += dayTotal;
      }

      let tagsHtml = "";
      if (dayTrades.length) {
        const allTags = [].concat(...dayTrades.map(t => t.tags || []));
        const shown = allTags.slice(0, 2);
        tagsHtml = `<div class="calendar-day-tags">` +
          shown.map(t => `<span class="calendar-tag">${escapeHtml(t)}</span>`).join("") +
          (allTags.length > shown.length ? `<span class="calendar-tag">+${allTags.length - shown.length}</span>` : "") +
          `</div>`;
      }

      div.innerHTML = `
        <div class="calendar-day-num">${cell.day}</div>
        ${dayTrades.length ? `<div class="calendar-day-pnl ${dayTotal >= 0 ? "pos" : "neg"} mono">${fmtMoney(dayTotal)}</div>
        <div class="calendar-day-count">${dayTrades.length} เทรด</div>` : ""}
        ${tagsHtml}
      `;
      if (dayTrades.length) {
        div.addEventListener("click", () => {
          switchTab("log");
          applyLogDateFilter(cell.key);
        });
      }
      grid.appendChild(div);
    });

    const totalEl = document.getElementById("calMonthTotal");
    totalEl.textContent = fmtMoney(monthTotal);
    totalEl.className = "mono " + (monthTotal >= 0 ? "" : "");
    totalEl.style.color = monthTotal > 0 ? "var(--bull)" : monthTotal < 0 ? "var(--bear)" : "var(--muted)";
  }

  document.getElementById("prevMonthBtn").addEventListener("click", () => {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById("nextMonthBtn").addEventListener("click", () => {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });
  document.getElementById("todayBtn").addEventListener("click", () => {
    calYear = today.getFullYear();
    calMonth = today.getMonth();
    renderCalendar();
  });

  /* ---------- overview: stats + charts ---------- */
  function computeStats() {
    const total = trades.length;
    const wins = trades.filter(t => Number(t.pnl) > 0);
    const losses = trades.filter(t => Number(t.pnl) < 0);
    const totalPnl = trades.reduce((s, t) => s + (Number(t.pnl) || 0), 0);
    const winRate = total ? (wins.length / total * 100) : 0;
    const avgWin = wins.length ? wins.reduce((s, t) => s + Number(t.pnl), 0) / wins.length : 0;
    const avgLoss = losses.length ? losses.reduce((s, t) => s + Number(t.pnl), 0) / losses.length : 0;
    const grossWin = wins.reduce((s, t) => s + Number(t.pnl), 0);
    const grossLoss = Math.abs(losses.reduce((s, t) => s + Number(t.pnl), 0));
    const profitFactor = grossLoss > 0 ? (grossWin / grossLoss) : (grossWin > 0 ? Infinity : 0);

    const byDate = tradesByDate();
    let bestDay = null, worstDay = null;
    Object.keys(byDate).forEach(key => {
      const sum = byDate[key].reduce((s, t) => s + (Number(t.pnl) || 0), 0);
      if (!bestDay || sum > bestDay.sum) bestDay = { key, sum };
      if (!worstDay || sum < worstDay.sum) worstDay = { key, sum };
    });

    return { total, wins: wins.length, losses: losses.length, totalPnl, winRate, avgWin, avgLoss, profitFactor, bestDay, worstDay };
  }

  function renderOverview() {
    const s = computeStats();
    const grid = document.getElementById("statsGrid");
    function metric(label, value, cls) {
      return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value mono ${cls || ""}">${value}</div></div>`;
    }
    grid.innerHTML = [
      metric("กำไร/ขาดทุนรวม", fmtMoney(s.totalPnl), s.totalPnl >= 0 ? "pos" : "neg"),
      metric("จำนวนเทรดทั้งหมด", s.total),
      metric("Win Rate", s.total ? s.winRate.toFixed(1) + "%" : "—"),
      metric("เทรดชนะ / แพ้", `${s.wins} / ${s.losses}`),
      metric("กำไรเฉลี่ย/ครั้ง", s.wins ? fmtMoney(s.avgWin) : "—", "pos"),
      metric("ขาดทุนเฉลี่ย/ครั้ง", s.losses ? fmtMoney(s.avgLoss) : "—", "neg"),
      metric("Profit Factor", s.profitFactor === Infinity ? "∞" : s.total ? s.profitFactor.toFixed(2) : "—"),
      metric("วันที่ดีที่สุด", s.bestDay ? `${s.bestDay.key} (${fmtMoney(s.bestDay.sum)})` : "—", s.bestDay && s.bestDay.sum >= 0 ? "pos" : ""),
      metric("วันที่แย่ที่สุด", s.worstDay ? `${s.worstDay.key} (${fmtMoney(s.worstDay.sum)})` : "—", s.worstDay && s.worstDay.sum < 0 ? "neg" : ""),
    ].join("");

    document.getElementById("equityChartWrap").innerHTML = buildEquityCurveSvg();
    document.getElementById("monthlyChartWrap").innerHTML = buildMonthlyBarChart();
  }

  function buildEquityCurveSvg() {
    if (!trades.length) return '<div class="empty">ยังไม่มีข้อมูลเทรด</div>';
    const sorted = [...trades].sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
    let cum = 0;
    const points = sorted.map(t => { cum += Number(t.pnl) || 0; return cum; });

    const w = 900, h = 260, padL = 60, padR = 20, padT = 20, padB = 30;
    const minV = Math.min(0, ...points);
    const maxV = Math.max(0, ...points);
    const range = (maxV - minV) || 1;
    const xStep = points.length > 1 ? (w - padL - padR) / (points.length - 1) : 0;
    const xAt = i => padL + i * xStep;
    const yAt = v => padT + (h - padT - padB) * (1 - (v - minV) / range);
    const zeroY = yAt(0);
    const pathPts = points.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(" ");
    const last = points[points.length - 1];
    const lineColor = last >= 0 ? "var(--bull)" : "var(--bear)";

    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="260" preserveAspectRatio="none">
      <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" style="stroke:var(--line)" stroke-dasharray="4 4"/>
      <text x="${padL - 8}" y="${zeroY.toFixed(1)}" font-size="10" text-anchor="end" dy="4" style="fill:var(--muted)">0</text>
      <text x="${padL - 8}" y="${padT}" font-size="10" text-anchor="end" dy="4" style="fill:var(--muted)">${maxV.toFixed(0)}</text>
      <text x="${padL - 8}" y="${h - padB}" font-size="10" text-anchor="end" dy="4" style="fill:var(--muted)">${minV.toFixed(0)}</text>
      <polyline points="${pathPts}" fill="none" style="stroke:${lineColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${xAt(points.length - 1).toFixed(1)}" cy="${yAt(last).toFixed(1)}" r="4" style="fill:${lineColor}"/>
      <text x="${padL}" y="${h - 8}" font-size="11" style="fill:var(--muted)">${sorted[0].date}</text>
      <text x="${w - padR}" y="${h - 8}" font-size="11" text-anchor="end" style="fill:var(--muted)">${sorted[sorted.length - 1].date}</text>
    </svg>`;
  }

  function buildMonthlyBarChart() {
    if (!trades.length) return '<div class="empty">ยังไม่มีข้อมูลเทรด</div>';
    const now = new Date();
    const months = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ y: d.getFullYear(), m: d.getMonth(), total: 0 });
    }
    trades.forEach(t => {
      const [y, m] = t.date.split("-").map(Number);
      const bucket = months.find(mo => mo.y === y && mo.m === (m - 1));
      if (bucket) bucket.total += Number(t.pnl) || 0;
    });
    const maxAbs = Math.max(1, ...months.map(m => Math.abs(m.total)));

    return `<div class="bar-chart">` + months.map(mo => {
      const pct = Math.max(2, Math.round((Math.abs(mo.total) / maxAbs) * 100));
      const cls = mo.total > 0 ? "pos" : mo.total < 0 ? "neg" : "";
      return `<div class="bar-col">
        <div class="bar-track"><div class="bar-fill ${cls}" style="height:${pct}%${cls ? "" : ";background:var(--line)"}"></div></div>
        <div class="bar-label">${MONTH_SHORT_TH[mo.m]} ${String(mo.y).slice(2)}</div>
        <div class="bar-value mono ${cls}">${fmtMoney(mo.total)}</div>
      </div>`;
    }).join("") + `</div>`;
  }

  /* ---------- trade log ---------- */
  let logDateFilter = null;

  function applyLogDateFilter(key) {
    logDateFilter = key;
    renderLog();
  }

  document.getElementById("logMarketFilter").addEventListener("change", renderLog);
  document.getElementById("logDateFilterClear").addEventListener("click", () => {
    logDateFilter = null;
    renderLog();
  });

  function renderLog() {
    const marketFilter = document.getElementById("logMarketFilter").value;
    const clearBtn = document.getElementById("logDateFilterClear");
    if (logDateFilter) {
      clearBtn.textContent = `✕ วันที่ ${logDateFilter}`;
      clearBtn.classList.remove("hidden");
    } else {
      clearBtn.classList.add("hidden");
    }

    let list = [...trades];
    if (marketFilter) list = list.filter(t => t.marketType === marketFilter);
    if (logDateFilter) list = list.filter(t => t.date === logDateFilter);
    list.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));

    const wrap = document.getElementById("logTableWrap");
    if (!list.length) {
      wrap.innerHTML = '<div class="empty">ยังไม่มีรายการเทรดที่ตรงเงื่อนไข</div>';
      return;
    }

    wrap.innerHTML = `<div class="table-scroll"><table>
      <thead><tr>
        <th>วันที่</th><th>ตลาด</th><th>สัญลักษณ์</th><th>ทิศทาง</th><th>กำไร/ขาดทุน</th><th>แท็ก</th>
      </tr></thead>
      <tbody>
        ${list.map(t => `
          <tr class="trade-row" data-id="${t.id}">
            <td class="mono">${t.date}</td>
            <td><span class="badge market">${MARKET_LABEL[t.marketType] || t.marketType}</span></td>
            <td>${escapeHtml(t.symbol || "—")}</td>
            <td><span class="badge ${t.side === "long" ? "up" : "down"}">${t.side === "long" ? "LONG" : "SHORT"}</span></td>
            <td class="mono ${Number(t.pnl) >= 0 ? "" : ""}" style="color:${Number(t.pnl) >= 0 ? "var(--bull)" : "var(--bear)"}">${fmtMoney(t.pnl)}</td>
            <td>${(t.tags || []).map(tag => `<span class="tag-chip">${escapeHtml(tag)}</span>`).join("")}</td>
          </tr>
        `).join("")}
      </tbody>
    </table></div>`;

    wrap.querySelectorAll(".trade-row").forEach(row => {
      row.addEventListener("click", () => openTradeModal(row.dataset.id));
    });
  }

  /* ---------- add/edit trade modal ---------- */
  const tradeModal = document.getElementById("tradeModal");
  const tfMarketType = document.getElementById("tfMarketType");
  let editingId = null;

  function toggleMarketFields() {
    const type = tfMarketType.value;
    document.getElementById("tfForexFields").classList.toggle("hidden", type !== "forex");
    document.getElementById("tfFuturesFields").classList.toggle("hidden", type !== "futures");
    document.getElementById("tfSymbolLabel").textContent =
      type === "forex" ? "คู่เงิน" : type === "futures" ? "สัญญา / Ticker" : "สัญลักษณ์";
    document.getElementById("tfSymbol").placeholder =
      type === "forex" ? "เช่น EUR/USD" : type === "futures" ? "เช่น ES, NQ, GC" : "เช่น AAPL, BTC/USD";
  }
  tfMarketType.addEventListener("change", toggleMarketFields);

  function openTradeModal(id) {
    editingId = id || null;
    const t = editingId ? trades.find(x => x.id === editingId) : null;

    document.getElementById("tradeModalTitle").textContent = t ? "แก้ไขเทรด" : "เพิ่มเทรดใหม่";
    document.getElementById("tradeDeleteBtn").classList.toggle("hidden", !t);

    document.getElementById("tfDate").value = t ? t.date : todayKey();
    tfMarketType.value = t ? t.marketType : "forex";
    document.getElementById("tfSymbol").value = t ? (t.symbol || "") : "";
    document.getElementById("tfSide").value = t ? t.side : "long";
    document.getElementById("tfLot").value = t && t.lot != null ? t.lot : "";
    document.getElementById("tfPips").value = t && t.pips != null ? t.pips : "";
    document.getElementById("tfContracts").value = t && t.contracts != null ? t.contracts : "";
    document.getElementById("tfPoints").value = t && t.points != null ? t.points : "";
    document.getElementById("tfEntry").value = t && t.entry != null ? t.entry : "";
    document.getElementById("tfExit").value = t && t.exit != null ? t.exit : "";
    document.getElementById("tfPnl").value = t ? t.pnl : "";
    document.getElementById("tfTags").value = t ? (t.tags || []).join(", ") : "";
    document.getElementById("tfNotes").value = t ? (t.notes || "") : "";

    toggleMarketFields();
    tradeModal.classList.add("open");
  }
  function closeTradeModal() {
    tradeModal.classList.remove("open");
    editingId = null;
  }

  document.getElementById("addTradeBtn").addEventListener("click", () => openTradeModal(null));
  document.getElementById("tradeModalClose").addEventListener("click", closeTradeModal);
  document.getElementById("tradeCancelBtn").addEventListener("click", closeTradeModal);
  tradeModal.addEventListener("click", (e) => { if (e.target === tradeModal) closeTradeModal(); });

  document.getElementById("tradeSaveBtn").addEventListener("click", () => {
    const date = document.getElementById("tfDate").value;
    const pnlRaw = document.getElementById("tfPnl").value;
    if (!date) { alert("กรุณาเลือกวันที่"); return; }
    if (pnlRaw === "" || isNaN(Number(pnlRaw))) { alert("กรุณาใส่กำไร/ขาดทุน ($) เป็นตัวเลข"); return; }

    const marketType = tfMarketType.value;
    const tags = document.getElementById("tfTags").value
      .split(",").map(s => s.trim()).filter(Boolean);

    const record = {
      id: editingId || uid(),
      date,
      marketType,
      symbol: document.getElementById("tfSymbol").value.trim(),
      side: document.getElementById("tfSide").value,
      lot: marketType === "forex" && document.getElementById("tfLot").value !== "" ? Number(document.getElementById("tfLot").value) : null,
      pips: marketType === "forex" && document.getElementById("tfPips").value !== "" ? Number(document.getElementById("tfPips").value) : null,
      contracts: marketType === "futures" && document.getElementById("tfContracts").value !== "" ? Number(document.getElementById("tfContracts").value) : null,
      points: marketType === "futures" && document.getElementById("tfPoints").value !== "" ? Number(document.getElementById("tfPoints").value) : null,
      entry: document.getElementById("tfEntry").value !== "" ? Number(document.getElementById("tfEntry").value) : null,
      exit: document.getElementById("tfExit").value !== "" ? Number(document.getElementById("tfExit").value) : null,
      pnl: Number(pnlRaw),
      tags,
      notes: document.getElementById("tfNotes").value.trim(),
      createdAt: editingId ? (trades.find(x => x.id === editingId) || {}).createdAt || Date.now() : Date.now(),
    };

    if (editingId) {
      trades = trades.map(t => t.id === editingId ? record : t);
    } else {
      trades.push(record);
    }
    saveTrades();
    closeTradeModal();
    renderCalendar();
    renderLog();
  });

  document.getElementById("tradeDeleteBtn").addEventListener("click", () => {
    if (!editingId) return;
    if (confirm("ลบเทรดนี้หรือไม่?")) {
      trades = trades.filter(t => t.id !== editingId);
      saveTrades();
      closeTradeModal();
      renderCalendar();
      renderLog();
    }
  });

  /* ---------- export / import ---------- */
  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  document.getElementById("exportBtn").addEventListener("click", () => {
    const payload = { version: 1, exportedAt: new Date().toISOString(), trades };
    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    triggerDownload(blob, `trade-journal-backup-${todayKey()}.json`);
  });

  const importInput = document.getElementById("importInput");
  document.getElementById("importBtn").addEventListener("click", () => importInput.click());
  importInput.addEventListener("change", async () => {
    const file = importInput.files[0];
    importInput.value = "";
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if (!parsed || !Array.isArray(parsed.trades)) { alert("รูปแบบไฟล์ไม่ถูกต้อง"); return; }
      const imported = parsed.trades.map(t => ({ ...t, id: uid() }));
      trades = trades.concat(imported);
      saveTrades();
      renderCalendar();
      renderLog();
      alert(`นำเข้าเรียบร้อย ${imported.length} รายการ`);
    } catch (err) {
      console.error(err);
      alert("นำเข้าข้อมูลไม่สำเร็จ ไฟล์อาจเสียหายหรือไม่ใช่ไฟล์สำรองที่ถูกต้อง");
    }
  });

  /* ---------- init ---------- */
  toggleMarketFields();
  renderCalendar();
})();
</script>
</body>
