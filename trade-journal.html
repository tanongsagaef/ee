<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>TRADE JOURNAL</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-alt: #f3f4f9;
    --border: #e5e7f0;
    --text: #14162a;
    --muted: #6b7080;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #eef0fe;
    --bull: #16a34a;
    --bull-soft: rgba(22,163,74,0.10);
    --bear: #dc2626;
    --bear-soft: rgba(220,38,38,0.10);
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 16px rgba(16,24,40,.06);
    --radius: 14px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1117;
    --surface: #171923;
    --surface-alt: #1e2029;
    --border: #2a2d3a;
    --text: #eceefb;
    --muted: #9a9db3;
    --accent: #8386ff;
    --accent-hover: #9a9dff;
    --accent-soft: #262a52;
    --bull: #34c77b;
    --bull-soft: rgba(52,199,123,0.14);
    --bear: #ff6f68;
    --bear-soft: rgba(255,111,104,0.14);
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Sarabun", "Noto Sans Thai", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    padding-bottom: 60px;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: 0.2px; }
  .brand .dot { color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .back-link {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 9px 14px; border-radius: 10px; font-size: 13px; text-decoration: none;
    display: inline-flex; align-items: center; font-weight: 600;
  }
  .back-link:hover { border-color: var(--accent); color: var(--accent); }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; background: var(--surface-alt); padding: 5px; border-radius: 12px; width: fit-content; }
  .tab-btn { background: transparent; border: none; color: var(--muted); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; }
  .tab-btn.active { color: var(--accent); background: var(--surface); box-shadow: var(--shadow); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .panel h3 { margin: 0 0 14px 0; font-size: 13px; letter-spacing: 0.4px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    background: var(--surface-alt); border: 1px solid var(--border); color: var(--text);
    padding: 9px 11px; border-radius: 8px; font-size: 13px; font-family: inherit; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; }
  button.primary { background: var(--accent); color: #fff; border: none; padding: 9px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
  button.primary:hover { background: var(--accent-hover); }
  button.ghost { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  button.ghost.danger:hover { border-color: var(--bear); color: var(--bear); }
  .icon-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .field { margin-bottom: 12px; flex: 1; min-width: 140px; }
  label.small { font-size: 11px; color: var(--muted); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 700; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); font-size: 13px; padding: 30px; text-align: center; }

  /* buy/sell toggle */
  .side-toggle { display: flex; gap: 8px; }
  .side-btn { flex: 1; padding: 11px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface-alt); color: var(--muted); font-weight: 800; cursor: pointer; font-size: 13px; letter-spacing: 0.3px; }
  .side-btn.buy.active { background: var(--bull-soft); border-color: var(--bull); color: var(--bull); }
  .side-btn.sell.active { background: var(--bear-soft); border-color: var(--bear); color: var(--bear); }

  /* trade grade */
  .grade-toggle { display: flex; gap: 6px; }
  .grade-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface-alt); color: var(--muted); font-weight: 800; cursor: pointer; font-size: 14px; }
  .grade-btn.active[data-grade="A"] { background: var(--bull-soft); border-color: var(--bull); color: var(--bull); }
  .grade-btn.active[data-grade="B"] { background: rgba(101,163,13,0.12); border-color: #65a30d; color: #65a30d; }
  .grade-btn.active[data-grade="C"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .grade-btn.active[data-grade="D"] { background: rgba(217,119,6,0.12); border-color: #d97706; color: #d97706; }
  .grade-btn.active[data-grade="E"] { background: var(--bear-soft); border-color: var(--bear); color: var(--bear); }
  .grade-pill { font-size: 11px; font-weight: 800; border-radius: 20px; padding: 3px 10px; display: inline-block; }
  .grade-pill.grade-A { background: var(--bull-soft); color: var(--bull); }
  .grade-pill.grade-B { background: rgba(101,163,13,0.12); color: #65a30d; }
  .grade-pill.grade-C { background: var(--accent-soft); color: var(--accent); }
  .grade-pill.grade-D { background: rgba(217,119,6,0.12); color: #d97706; }
  .grade-pill.grade-E { background: var(--bear-soft); color: var(--bear); }

  /* tradingview link */
  .tv-link-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); border: 1px solid rgba(79,70,229,0.3); color: var(--accent); padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 700; text-decoration: none; margin: 6px 0; }
  .tv-link-btn:hover { background: var(--accent); color: #fff; }

  /* checkbox row */
  .check-row { display: flex; flex-wrap: wrap; gap: 14px; }
  .check-item { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; }
  .check-item input { width: auto; accent-color: var(--accent); cursor: pointer; }

  /* image upload */
  .file-btn { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .file-btn:hover { border-color: var(--accent); color: var(--accent); }
  .image-preview-item { display: flex; align-items: center; gap: 10px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
  .image-preview-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .image-preview-item button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; margin-left: auto; }
  .image-preview-item button:hover { color: var(--bear); }

  /* metrics */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .metric { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .metric-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; font-weight: 700; }
  .metric-value { font-family: ui-monospace, monospace; font-size: 18px; font-weight: 800; }
  .metric-value.pos { color: var(--bull); }
  .metric-value.neg { color: var(--bear); }

  /* calendar */
  .calendar-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .calendar-nav { display: flex; align-items: center; gap: 10px; }
  .calendar-month-label { font-size: 17px; font-weight: 800; min-width: 150px; text-align: center; }
  .calendar-total { font-size: 14px; color: var(--muted); font-weight: 600; }
  .calendar-total .mono { font-weight: 800; font-size: 16px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(5, 1fr) 1.3fr; gap: 7px; }
  .calendar-summary-cell { min-height: 84px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; background: var(--surface); display: flex; flex-direction: column; justify-content: center; }
  .calendar-summary-label { font-size: 9.5px; color: var(--muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
  .calendar-summary-pnl { font-family: ui-monospace, monospace; font-weight: 800; font-size: 13px; }
  .calendar-summary-pnl.pos { color: var(--bull); }
  .calendar-summary-pnl.neg { color: var(--bear); }
  .calendar-summary-count { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .calendar-dow { font-size: 11px; color: var(--muted); text-transform: uppercase; text-align: center; padding-bottom: 4px; font-weight: 700; }
  .calendar-day { min-height: 84px; border: 1px solid var(--border); border-radius: 10px; padding: 7px 9px; background: var(--surface-alt); display: flex; flex-direction: column; }
  .calendar-day.other-month { opacity: 0.35; }
  .calendar-day.has-trades { cursor: pointer; }
  .calendar-day.has-trades:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .calendar-day.profit { background: var(--bull-soft); border-color: rgba(22,163,74,0.35); }
  .calendar-day.loss { background: var(--bear-soft); border-color: rgba(220,38,38,0.35); }
  .calendar-day.today { box-shadow: 0 0 0 2px var(--accent) inset; }
  .calendar-day-num { font-size: 11px; color: var(--muted); font-weight: 600; }
  .calendar-day-pnl { font-family: ui-monospace, monospace; font-weight: 800; font-size: 13px; margin-top: 4px; }
  .calendar-day-pnl.pos { color: var(--bull); }
  .calendar-day-pnl.neg { color: var(--bear); }
  .calendar-day-count { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .calendar-day-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; padding-top: 4px; }
  .calendar-tag { font-size: 8.5px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--muted); white-space: nowrap; font-weight: 600; }
  @media (max-width: 720px) {
    .calendar-day { min-height: 58px; padding: 5px 6px; }
    .calendar-day-tags, .calendar-day-num { display: none; }
    .calendar-day-pnl { font-size: 11px; margin-top: 2px; }
  }

  /* charts */
  .chart-wrap { overflow-x: auto; }
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 190px; padding-top: 10px; }
  .bar-col { flex: 1; min-width: 26px; display: flex; flex-direction: column; align-items: center; height: 100%; }
  .bar-track { width: 100%; height: 140px; display: flex; align-items: flex-end; }
  .bar-fill { width: 100%; border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar-fill.pos { background: var(--bull); }
  .bar-fill.neg { background: var(--bear); }
  .bar-label { font-size: 9.5px; color: var(--muted); margin-top: 6px; white-space: nowrap; font-weight: 600; }
  .bar-value { font-size: 9.5px; margin-top: 2px; white-space: nowrap; font-weight: 700; }
  .bar-value.pos { color: var(--bull); }
  .bar-value.neg { color: var(--bear); }

  /* table */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 700; }
  tr.trade-row { cursor: pointer; }
  tr.trade-row:hover td { background: var(--surface-alt); }
  .row-symbol { display: flex; align-items: center; gap: 8px; }
  .row-thumb { width: 26px; height: 26px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border); }
  .badge { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 800; display: inline-block; }
  .badge.up { color: var(--bull); background: var(--bull-soft); }
  .badge.down { color: var(--bear); background: var(--bear-soft); }
  .badge.market { color: var(--accent); background: var(--accent-soft); }
  .tag-chip { font-size: 10px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; margin-right: 3px; margin-bottom: 3px; display: inline-block; color: var(--muted); font-weight: 600; }
  .tag-chip.positive { background: var(--bull-soft); border-color: rgba(22,163,74,0.35); color: var(--bull); }
  .tag-chip.negative { background: var(--bear-soft); border-color: rgba(220,38,38,0.35); color: var(--bear); }
  .flag-badge { font-size: 10.5px; background: var(--accent-soft); border: 1px solid rgba(79,70,229,0.3); color: var(--accent); border-radius: 5px; padding: 2px 8px; margin-right: 4px; margin-bottom: 3px; display: inline-block; font-weight: 700; }

  /* modal */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(20,22,42,.45); z-index: 30; align-items: center; justify-content: center; padding: 16px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 22px 24px; box-shadow: 0 20px 50px rgba(16,24,40,.25); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-header h2 { font-size: 17px; margin: 0; font-weight: 800; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; border-top: 1px solid var(--border); padding-top: 16px; }
  .modal-footer .spacer { flex: 1; }

  /* day-detail modal */
  .day-modal-summary { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .day-modal-total { font-family: ui-monospace, monospace; font-size: 24px; font-weight: 800; }
  .day-modal-total.pos { color: var(--bull); }
  .day-modal-total.neg { color: var(--bear); }
  .day-modal-count { color: var(--muted); font-size: 13px; }
  .day-modal-trades { display: flex; flex-direction: column; gap: 10px; }
  .trade-card { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .trade-card-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .trade-card-pnl { margin-left: auto; font-family: ui-monospace, monospace; font-weight: 800; font-size: 15px; }
  .trade-card-pnl.pos { color: var(--bull); }
  .trade-card-pnl.neg { color: var(--bear); }
  .trade-card-edit { background: var(--surface); border: 1px solid var(--border); color: var(--muted); width: 28px; height: 28px; border-radius: 7px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
  .trade-card-edit:hover { border-color: var(--accent); color: var(--accent); }
  .trade-card-symbol { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .trade-card-image { max-width: 100%; max-height: 300px; width: 100%; object-fit: contain; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); margin: 8px 0; display: block; }
  .trade-card-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px 14px; margin: 8px 0; padding: 10px 12px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); }
  .trade-card-detail { display: flex; flex-direction: column; }
  .trade-card-detail span:first-child { color: var(--muted); font-size: 10px; text-transform: uppercase; margin-bottom: 2px; font-weight: 700; letter-spacing: 0.3px; }
  .trade-card-detail span:last-child { font-weight: 700; font-size: 12.5px; }
  .trade-card-tags-row { margin-top: 6px; }
  .trade-card-notes { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>

<div class="header">
  <div class="brand"><span class="dot">●</span> Trade Journal</div>
  <div class="row">
    <a href="index.html" class="back-link">← ทบทวน Elliott Wave</a>
    <a href="stock-decision-terminal.html" class="back-link">STOCK/DECIDE</a>
    <button class="ghost" id="exportBtn">⬇ ส่งออกข้อมูล</button>
    <button class="ghost" id="importBtn">⬆ นำเข้าข้อมูล</button>
    <input type="file" id="importInput" accept="application/json" hidden>
    <button class="primary" id="addTradeBtn">+ เพิ่มเทรด</button>
    <button id="themeToggle" class="icon-btn" aria-label="สลับโหมดสี" title="สลับโหมดสว่าง/มืด">
      <svg id="iconSun" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4.5a1 1 0 0 1-1-1V2a1 1 0 1 1 2 0v1.5a1 1 0 0 1-1 1zm0 15a1 1 0 0 1 1 1V22a1 1 0 1 1-2 0v-1.5a1 1 0 0 1 1-1zm7.5-7.5a1 1 0 0 1 1-1H22a1 1 0 1 1 0 2h-1.5a1 1 0 0 1-1-1zm-15 0a1 1 0 0 1-1 1H2a1 1 0 1 1 0-2h1.5a1 1 0 0 1 1 1zm12.02-5.52a1 1 0 0 1 0-1.42l1.06-1.06a1 1 0 1 1 1.42 1.42l-1.06 1.06a1 1 0 0 1-1.42 0zm-11.04 11.04a1 1 0 0 1 0-1.42l1.06-1.06a1 1 0 1 1 1.42 1.42L6.9 17.52a1 1 0 0 1-1.42 0zm11.04 0a1 1 0 0 1 1.42 0l1.06 1.06a1 1 0 1 1-1.42 1.42l-1.06-1.06a1 1 0 0 1 0-1.42zM5.48 5.48a1 1 0 0 1 1.42 0l1.06 1.06A1 1 0 1 1 6.54 7.96L5.48 6.9a1 1 0 0 1 0-1.42zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
      <svg id="iconMoon" viewBox="0 0 24 24" width="18" height="18" style="display:none"><path fill="currentColor" d="M20.7 15.5A8.5 8.5 0 0 1 8.5 3.3a.6.6 0 0 0-.77-.75A10 10 0 1 0 21.45 16.3a.6.6 0 0 0-.75-.8z"/></svg>
    </button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="calendar">ปฏิทิน</button>
  <button class="tab-btn" data-tab="overview">ภาพรวม</button>
  <button class="tab-btn" data-tab="log">บันทึกเทรด</button>
</div>

<!-- CALENDAR TAB -->
<div id="tab-calendar">
  <div class="panel">
    <div class="calendar-toolbar">
      <div class="calendar-nav">
        <button class="icon-btn" id="prevMonthBtn">‹</button>
        <div class="calendar-month-label" id="calMonthLabel"></div>
        <button class="icon-btn" id="nextMonthBtn">›</button>
        <button class="ghost" id="todayBtn">วันนี้</button>
      </div>
      <div class="calendar-total">รวมเดือนนี้ <span class="mono" id="calMonthTotal"></span></div>
    </div>
    <div class="calendar-grid" id="calendarDow"></div>
    <div class="calendar-grid" id="calendarGrid" style="margin-top:7px;"></div>
  </div>
</div>

<!-- OVERVIEW TAB -->
<div id="tab-overview" class="hidden">
  <div class="panel">
    <h3>สรุปสถิติทั้งหมด</h3>
    <div class="metrics-grid" id="statsGrid"></div>
  </div>
  <div class="panel">
    <h3>Performance Profile</h3>
    <div class="chart-wrap" id="radarChartWrap"></div>
  </div>
  <div class="panel">
    <h3>กราฟการเติบโต (Equity Curve)</h3>
    <div class="chart-wrap" id="equityChartWrap"></div>
  </div>
  <div class="panel">
    <h3>กำไร/ขาดทุนรายเดือน (12 เดือนล่าสุด)</h3>
    <div class="chart-wrap" id="monthlyChartWrap"></div>
  </div>
</div>

<!-- LOG TAB -->
<div id="tab-log" class="hidden">
  <div class="panel">
    <div class="row" style="justify-content:space-between;">
      <h3 style="margin:0;">บันทึกเทรดทั้งหมด</h3>
      <select id="logMarketFilter" style="width:auto;">
        <option value="">ทุกประเภทตลาด</option>
        <option value="forex">Forex</option>
        <option value="futures">Futures</option>
        <option value="other">อื่นๆ</option>
      </select>
    </div>
    <div id="logTableWrap" style="margin-top:12px;"></div>
  </div>
</div>

<!-- Add/Edit Trade Modal -->
<div id="tradeModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 id="tradeModalTitle">เพิ่มเทรดใหม่</h2>
      <button class="icon-btn" id="tradeModalClose">✕</button>
    </div>

    <div class="row">
      <div class="field">
        <label class="small">วันที่</label>
        <input type="date" id="tfDate">

    <div class="row">
      <div class="field"><label class="small">ราคาเข้า</label><input type="number" id="tfEntry" step="any"></div>

    <div class="row">

        <select id="tfSession">
          <option value="">-- ไม่ระบุ --</option>
          <option value="London">London</option>
          <option value="New York">New York</option>
          <option value="Asia">Asia</option>

        <label class="small">บัญชี (Account)</label>
        <input type="text" id="tfAccount" placeholder="เช่น Live 1, Demo">

    <div class="field">
      <label class="small">กลยุทธ์ / Model</label>
      <input type="text" id="tfModel" placeholder="เช่น Breakout Retest, ICT FVG">

    <div class="field">
      <label class="small">เกรดการเทรด (เมื่อเทรดเสร็จ)</label>
      <div class="grade-toggle" id="tfGradeToggle">
        <button type="button" class="grade-btn" data-grade="A">A</button>
        <button type="button" class="grade-btn" data-grade="B">B</button>
        <button type="button" class="grade-btn" data-grade="C">C</button>
        <button type="button" class="grade-btn" data-grade="D">D</button>
        <button type="button" class="grade-btn" data-grade="E">E</button>

    <div class="field">
      <label class="small">การวินัยในการเทรด</label>
      <div class="check-row">
        <label class="check-item"><input type="checkbox" id="tfFollowedRules"> ทำตามแผน</label>
        <label class="check-item"><input type="checkbox" id="tfBreakeven"> ปิดที่จุดคุ้มทุน (BE)</label>
        <label class="check-item"><input type="checkbox" id="tfEntryWindow"> เข้าตามช่วงเวลาที่วางแผน</label>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label class="small">แท็กบวก — สิ่งที่ทำได้ดี (คั่นด้วยคอมมา)</label>
        <input type="text" id="tfTags" placeholder="เช่น BREAKOUT, FOLLOWED PLAN">
      </div>
      <div class="field">
        <label class="small">แท็กลบ — ข้อผิดพลาด (คั่นด้วยคอมมา)</label>
        <input type="text" id="tfNegTags" placeholder="เช่น FOMO, REVENGE TRADE">

    <div class="row">
      <div class="field">

        <div id="tfImageBeforePreview"></div>
        <label class="file-btn">
          <span id="tfImageBeforeLabelText">+ เพิ่มรูปภาพ</span>
          <input type="file" accept="image/*" id="tfImageBeforeInput" hidden>
        </label>
      </div>
      <div class="field">
        <label class="small">รูปหลังเทรดเสร็จ</label>
        <div id="tfImageAfterPreview"></div>
        <label class="file-btn">
          <span id="tfImageAfterLabelText">+ เพิ่มรูปภาพ</span>
          <input type="file" accept="image/*" id="tfImageAfterInput" hidden>
        </label>
      </div>
    </div>

    <div class="field">
      <label class="small">ลิงก์ TradingView (ถ้ามี)</label>
      <input type="text" id="tfTvLink" placeholder="https://www.tradingview.com/x/xxxxxxxx/">
    </div>

    <div class="field">
      <label class="small">ความเห็นหลังเทรด (Trade Review)</label>
      <textarea id="tfNotes" rows="3" placeholder="สิ่งที่เรียนรู้ สิ่งที่ควรทำต่างไปครั้งหน้า ฯลฯ"></textarea>
    </div>

    <div class="modal-footer">
      <button class="ghost danger hidden" id="tradeDeleteBtn">ลบเทรดนี้</button>
      <div class="spacer"></div>
      <button class="ghost" id="tradeCancelBtn">ยกเลิก</button>
      <button class="primary" id="tradeSaveBtn">บันทึก</button>

</div>

<!-- Day-detail Modal -->
<div id="dayModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 id="dayModalTitle">รายละเอียดวันที่</h2>
      <button class="icon-btn" id="dayModalClose">✕</button>
    </div>
    <div class="day-modal-summary" id="dayModalSummary"></div>
    <div class="day-modal-trades" id="dayModalTrades"></div>
    <div class="modal-footer">
      <button class="ghost" id="dayModalAddBtn">+ เพิ่มเทรดวันนี้</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const LS_KEY = "tj_trades_v1";
  const MONTH_NAMES_TH = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  const MONTH_SHORT_TH = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const DOW_TH = ["จ","อ","พ","พฤ","ศ","สรุป"];
  const MARKET_LABEL = { forex: "Forex", futures: "Futures", other: "อื่นๆ" };

  function loadTrades() {
    try {
      const parsed = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }
  function saveTrades() { localStorage.setItem(LS_KEY, JSON.stringify(trades)); }

  let trades = loadTrades();

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function dateKey(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }
  function todayKey() { const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }
  function escapeHtml(str) {
    return (str || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }
  function fmtMoney(n) {
    const v = Number(n) || 0;
    const sign = v > 0 ? "+" : "";
    return sign + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function resizeImageToDataUrl(file, maxWidth) {
    return new Promise((resolve) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      reader.readAsDataURL(file);
    });
  }

  /* ---------- theme ---------- */
  const root = document.documentElement;
  const iconSun = document.getElementById("iconSun");
  const iconMoon = document.getElementById("iconMoon");

  function applyTheme(theme) {
    if (theme === "dark") {
      root.setAttribute("data-theme", "dark");
      iconSun.style.display = "none";
      iconMoon.style.display = "";
    } else {
      root.setAttribute("data-theme", "light");
      iconSun.style.display = "";
      iconMoon.style.display = "none";
    }
    localStorage.setItem("tj_theme", theme);
  }

  const savedTheme = localStorage.getItem("tj_theme") ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(savedTheme);

  document.getElementById("themeToggle").addEventListener("click", () => {
    const current = root.getAttribute("data-theme");
    applyTheme(current === "dark" ? "light" : "dark");
  });

  /* ---------- tabs ---------- */
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });
  function switchTab(tab) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    document.getElementById("tab-calendar").classList.toggle("hidden", tab !== "calendar");
    document.getElementById("tab-overview").classList.toggle("hidden", tab !== "overview");
    document.getElementById("tab-log").classList.toggle("hidden", tab !== "log");
    if (tab === "overview") renderOverview();
    if (tab === "log") renderLog();
  }

  /* ---------- calendar ---------- */
  const today = new Date();
  let calYear = today.getFullYear();
  let calMonth = today.getMonth();

  const calendarDow = document.getElementById("calendarDow");
  DOW_TH.forEach((d, i) => {
    const el = document.createElement("div");
    el.className = "calendar-dow";
    if (i === DOW_TH.length - 1) el.style.color = "var(--accent)";
    el.textContent = d;
    calendarDow.appendChild(el);
  });

  function tradesByDate() {
    const map = {};
    trades.forEach(t => {
      if (!map[t.date]) map[t.date] = [];
      map[t.date].push(t);
    });
    return map;
  }

  function renderCalendar() {
    document.getElementById("calMonthLabel").textContent = `${MONTH_NAMES_TH[calMonth]} ${calYear}`;
    const byDate = tradesByDate();
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    // Monday-indexed first day of month (0=Mon ... 6=Sun)
    const firstDowSun = new Date(calYear, calMonth, 1).getDay();
    const firstDowMon = (firstDowSun + 6) % 7;
    const daysInThisMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const firstCellDate = new Date(calYear, calMonth, 1 - firstDowMon);
    const totalCells = Math.ceil((firstDowMon + daysInThisMonth) / 7) * 7;
    const weekCount = totalCells / 7;

    let monthTotal = 0;

    for (let w = 0; w < weekCount; w++) {
      const weekDates = [];
      for (let d = 0; d < 7; d++) {
        const dt = new Date(firstCellDate);
        dt.setDate(firstCellDate.getDate() + w * 7 + d);
        weekDates.push(dt);
      }

      // Mon-Fri visible cells
      for (let d = 0; d < 5; d++) {
        const dt = weekDates[d];
        const inMonth = dt.getMonth() === calMonth;
        const key = dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
        const div = document.createElement("div");
        div.className = "calendar-day";
        if (!inMonth) {
          div.classList.add("other-month");
          div.innerHTML = `<div class="calendar-day-num">${dt.getDate()}</div>`;
          grid.appendChild(div);
          continue;
        }
        const dayTrades = byDate[key] || [];
        const dayTotal = dayTrades.reduce((s, t) => s + (Number(t.pnl) || 0), 0);
        if (key === todayKey()) div.classList.add("today");
        if (dayTrades.length) {
          div.classList.add("has-trades");
          div.classList.add(dayTotal >= 0 ? "profit" : "loss");
        }
        monthTotal += dayTotal;

        let tagsHtml = "";
        if (dayTrades.length) {
          const allTags = [].concat(...dayTrades.map(t => t.tags || []));
          const shown = allTags.slice(0, 2);
          tagsHtml = `<div class="calendar-day-tags">` +
            shown.map(tag => `<span class="calendar-tag">${escapeHtml(tag)}</span>`).join("") +
            (allTags.length > shown.length ? `<span class="calendar-tag">+${allTags.length - shown.length}</span>` : "") +
            `</div>`;
        }

        div.innerHTML = `
          <div class="calendar-day-num">${dt.getDate()}</div>
          ${dayTrades.length ? `<div class="calendar-day-pnl ${dayTotal >= 0 ? "pos" : "neg"} mono">${fmtMoney(dayTotal)}</div>
          <div class="calendar-day-count">${dayTrades.length} เทรด</div>` : ""}
          ${tagsHtml}
        `;
        if (dayTrades.length) {
          div.addEventListener("click", () => openDayModal(key));
        }
        grid.appendChild(div);
      }

      // weekly summary cell (sums all 7 days, including weekend, even though only Mon-Fri are shown)
      let weekTotal = 0, weekCount2 = 0;
      weekDates.forEach(dt => {
        const key = dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
        const dayTrades = byDate[key] || [];
        weekTotal += dayTrades.reduce((s, t) => s + (Number(t.pnl) || 0), 0);
        weekCount2 += dayTrades.length;
      });
      const sumDiv = document.createElement("div");
      sumDiv.className = "calendar-summary-cell";
      if (weekCount2) {
        sumDiv.innerHTML = `
          <div class="calendar-summary-label">สัปดาห์นี้</div>
          <div class="calendar-summary-pnl ${weekTotal >= 0 ? "pos" : "neg"} mono">${fmtMoney(weekTotal)}</div>
          <div class="calendar-summary-count">${weekCount2} เทรด</div>
        `;
      } else {
        sumDiv.innerHTML = `<div class="calendar-summary-label">สัปดาห์นี้</div><div class="calendar-summary-count">—</div>`;
      }
      grid.appendChild(sumDiv);
    }

    const totalEl = document.getElementById("calMonthTotal");
    totalEl.textContent = fmtMoney(monthTotal);
    totalEl.style.color = monthTotal > 0 ? "var(--bull)" : monthTotal < 0 ? "var(--bear)" : "var(--muted)";
  }

  document.getElementById("prevMonthBtn").addEventListener("click", () => {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById("nextMonthBtn").addEventListener("click", () => {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });
  document.getElementById("todayBtn").addEventListener("click", () => {
    calYear = today.getFullYear();
    calMonth = today.getMonth();
    renderCalendar();
  });

  /* ---------- day-detail modal ---------- */
  const dayModal = document.getElementById("dayModal");
  let dayModalDate = null;

  function tradeCardHtml(t) {
    const pnlNum = Number(t.pnl) || 0;
    const details = [];
    if (t.marketType === "forex") {
      if (t.lot != null) details.push(["Lot Size", t.lot]);
      if (t.pips != null) details.push(["Pips", t.pips]);
    } else if (t.marketType === "futures") {
      if (t.contracts != null) details.push(["Contracts", t.contracts]);
      if (t.points != null) details.push(["Points", t.points]);
    }
    if (t.entry != null) details.push(["ราคาเข้า", t.entry]);
    if (t.exit != null) details.push(["ราคาออก", t.exit]);
    if (t.session) details.push(["Session", t.session]);
    if (t.model) details.push(["Model", t.model]);
    if (t.account) details.push(["Account", t.account]);

    const flags = [];
    if (t.followedRules) flags.push("ทำตามแผน ✓");
    if (t.breakeven) flags.push("Breakeven");
    if (t.enteredWindow) flags.push("เข้าตามช่วงเวลา ✓");

    const posTags = t.tags || [];
    const negTags = t.negTags || [];
    // t.image is the legacy single-image field from before before/after images existed
    const imgBefore = t.imageBefore || null;
    const imgAfter = t.imageAfter || (!t.imageBefore ? t.image : null) || null;

    return `<div class="trade-card" data-id="${t.id}">
      <div class="trade-card-head">
        <span class="badge market">${MARKET_LABEL[t.marketType] || t.marketType}</span>
        <span class="badge ${t.side === "long" ? "up" : "down"}">${t.side === "long" ? "BUY" : "SELL"}</span>
        ${t.grade ? `<span class="grade-pill grade-${t.grade}">เกรด ${t.grade}</span>` : ""}
        <span class="trade-card-pnl mono ${pnlNum >= 0 ? "pos" : "neg"}">${fmtMoney(pnlNum)}</span>
        <button type="button" class="trade-card-edit" data-id="${t.id}" title="แก้ไขเทรดนี้">✎</button>
      </div>
      <div class="trade-card-symbol">${escapeHtml(t.symbol || "—")}</div>
      ${imgBefore ? `<div class="trade-card-detail" style="margin-bottom:6px;"><span>ก่อนเข้าเทรด</span></div><img class="trade-card-image" src="${imgBefore}">` : ""}
      ${imgAfter ? `<div class="trade-card-detail" style="margin:6px 0;"><span>หลังเทรดเสร็จ</span></div><img class="trade-card-image" src="${imgAfter}">` : ""}
      ${t.tvLink ? `<a class="tv-link-btn" href="${escapeHtml(t.tvLink)}" target="_blank" rel="noopener">📈 เปิดกราฟ TradingView ↗</a>` : ""}
      ${details.length ? `<div class="trade-card-details">${details.map(([k, v]) => `<div class="trade-card-detail"><span>${k}</span><span class="mono">${escapeHtml(String(v))}</span></div>`).join("")}</div>` : ""}
      ${flags.length ? `<div class="trade-card-tags-row">${flags.map(f => `<span class="flag-badge">${f}</span>`).join("")}</div>` : ""}
      ${posTags.length ? `<div class="trade-card-tags-row">${posTags.map(tag => `<span class="tag-chip positive">${escapeHtml(tag)}</span>`).join("")}</div>` : ""}
      ${negTags.length ? `<div class="trade-card-tags-row">${negTags.map(tag => `<span class="tag-chip negative">${escapeHtml(tag)}</span>`).join("")}</div>` : ""}
      ${t.notes ? `<div class="trade-card-notes">${escapeHtml(t.notes)}</div>` : ""}
    </div>`;
  }

  function openDayModal(key) {
    dayModalDate = key;
    const dayTrades = trades.filter(t => t.date === key).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const total = dayTrades.reduce((s, t) => s + (Number(t.pnl) || 0), 0);

    document.getElementById("dayModalTitle").textContent = key;
    document.getElementById("dayModalSummary").innerHTML = `
      <div class="day-modal-total ${total >= 0 ? "pos" : "neg"} mono">${fmtMoney(total)}</div>
      <div class="day-modal-count">${dayTrades.length} เทรด</div>
    `;
    document.getElementById("dayModalTrades").innerHTML = dayTrades.map(tradeCardHtml).join("");
    document.querySelectorAll("#dayModalTrades .trade-card-edit").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        closeDayModal();
        openTradeModal(id);
      });
    });

    dayModal.classList.add("open");
  }
  function closeDayModal() {
    dayModal.classList.remove("open");
  }
  document.getElementById("dayModalClose").addEventListener("click", closeDayModal);
  dayModal.addEventListener("click", (e) => { if (e.target === dayModal) closeDayModal(); });
  document.getElementById("dayModalAddBtn").addEventListener("click", () => {
    const prefill = dayModalDate;
    closeDayModal();
    openTradeModal(null, prefill);
  });

  /* ---------- overview: stats + charts ---------- */
  function computeStats() {
    const total = trades.length;
    const wins = trades.filter(t => Number(t.pnl) > 0);
    const losses = trades.filter(t => Number(t.pnl) < 0);
    const totalPnl = trades.reduce((s, t) => s + (Number(t.pnl) || 0), 0);
    const winRate = total ? (wins.length / total * 100) : 0;
    const avgWin = wins.length ? wins.reduce((s, t) => s + Number(t.pnl), 0) / wins.length : 0;
    const avgLoss = losses.length ? losses.reduce((s, t) => s + Number(t.pnl), 0) / losses.length : 0;
    const grossWin = wins.reduce((s, t) => s + Number(t.pnl), 0);
    const grossLoss = Math.abs(losses.reduce((s, t) => s + Number(t.pnl), 0));
    const profitFactor = grossLoss > 0 ? (grossWin / grossLoss) : (grossWin > 0 ? Infinity : 0);

    const byDate = tradesByDate();
    let bestDay = null, worstDay = null;
    Object.keys(byDate).forEach(key => {
      const sum = byDate[key].reduce((s, t) => s + (Number(t.pnl) || 0), 0);
      if (!bestDay || sum > bestDay.sum) bestDay = { key, sum };
      if (!worstDay || sum < worstDay.sum) worstDay = { key, sum };
    });

    return { total, wins: wins.length, losses: losses.length, totalPnl, winRate, avgWin, avgLoss, profitFactor, bestDay, worstDay };
  }

  function computeMaxDrawdown() {
    const sorted = [...trades].sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
    let cum = 0, peak = 0, maxDD = 0;
    sorted.forEach(t => {
      cum += Number(t.pnl) || 0;
      if (cum > peak) peak = cum;
      const dd = peak - cum;
      if (dd > maxDD) maxDD = dd;
    });
    return maxDD;
  }

  function computeRadarMetrics(s) {
    const maxDD = computeMaxDrawdown();
    const recoveryFactor = maxDD > 0 ? s.totalPnl / maxDD : (s.totalPnl > 0 ? 5 : 0);
    const recoveryScaled = Math.max(0, Math.min(100, (recoveryFactor / 5) * 100));

    const rulesTrades = trades.filter(t => t.followedRules !== undefined && t.followedRules !== null);
    const planAdherence = rulesTrades.length ? (rulesTrades.filter(t => t.followedRules).length / rulesTrades.length * 100) : 0;

    const byDate = tradesByDate();
    const days = Object.keys(byDate);
    const profitableDays = days.filter(k => byDate[k].reduce((sum, t) => sum + (Number(t.pnl) || 0), 0) > 0).length;
    const consistency = days.length ? (profitableDays / days.length * 100) : 0;

    const rr = (s.avgWin && s.avgLoss) ? (s.avgWin / Math.abs(s.avgLoss)) : 0;
    const rrScaled = Math.max(0, Math.min(100, (rr / 3) * 100));

    return [
      { label: "Win Rate", value: s.winRate },
      { label: "Plan Adherence", value: planAdherence },
      { label: "Recovery Factor", value: recoveryScaled },
      { label: "Risk/Reward", value: rrScaled },
      { label: "Consistency", value: consistency },
    ];
  }

  function buildRadarChart(s) {
    if (!trades.length) return '<div class="empty">ยังไม่มีข้อมูลเทรด</div>';
    const metrics = computeRadarMetrics(s);
    const size = 300, cx = size / 2, cy = size / 2 - 6, radius = 95;
    const n = metrics.length;
    const angleStep = (Math.PI * 2) / n;
    const startAngle = -Math.PI / 2;

    function pointAt(i, r) {
      const angle = startAngle + i * angleStep;
      return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
    }

    const rings = [0.25, 0.5, 0.75, 1.0];
    const gridPolys = rings.map(frac => {
      const pts = metrics.map((_, i) => pointAt(i, radius * frac).map(v => v.toFixed(1)).join(",")).join(" ");
      return `<polygon points="${pts}" fill="none" style="stroke:var(--border)" stroke-width="1"/>`;
    }).join("");

    const axisLines = metrics.map((_, i) => {
      const [x, y] = pointAt(i, radius);
      return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--border)" stroke-width="1"/>`;
    }).join("");

    const dataPts = metrics.map((m, i) => pointAt(i, radius * Math.max(0, Math.min(1, m.value / 100))).map(v => v.toFixed(1)).join(",")).join(" ");

    const labels = metrics.map((m, i) => {
      const [x, y] = pointAt(i, radius + 30);
      let anchor = "middle";
      if (Math.abs(x - cx) > 8) anchor = x > cx ? "start" : "end";
      return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="10.5" text-anchor="${anchor}" dy="0" style="fill:var(--muted)" font-weight="700">${m.label}</text>
        <text x="${x.toFixed(1)}" y="${(y + 13).toFixed(1)}" font-size="11" text-anchor="${anchor}" style="fill:var(--accent)" font-weight="800">${m.value.toFixed(0)}%</text>`;
    }).join("");

    return `<svg viewBox="0 0 ${size} ${size + 10}" width="100%" height="320" style="max-width:440px;display:block;margin:0 auto;overflow:visible;">
      ${gridPolys}
      ${axisLines}
      <polygon points="${dataPts}" fill="var(--accent-soft)" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round"/>
      ${labels}
    </svg>`;
  }

  function renderOverview() {
    const s = computeStats();
    const grid = document.getElementById("statsGrid");
    function metric(label, value, cls) {
      return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value mono ${cls || ""}">${value}</div></div>`;
    }
    grid.innerHTML = [
      metric("กำไร/ขาดทุนรวม", fmtMoney(s.totalPnl), s.totalPnl >= 0 ? "pos" : "neg"),
      metric("จำนวนเทรดทั้งหมด", s.total),
      metric("Win Rate", s.total ? s.winRate.toFixed(1) + "%" : "—"),
      metric("เทรดชนะ / แพ้", `${s.wins} / ${s.losses}`),
      metric("กำไรเฉลี่ย/ครั้ง", s.wins ? fmtMoney(s.avgWin) : "—", "pos"),
      metric("ขาดทุนเฉลี่ย/ครั้ง", s.losses ? fmtMoney(s.avgLoss) : "—", "neg"),
      metric("Profit Factor", s.profitFactor === Infinity ? "∞" : s.total ? s.profitFactor.toFixed(2) : "—"),
      metric("วันที่ดีที่สุด", s.bestDay ? `${s.bestDay.key} (${fmtMoney(s.bestDay.sum)})` : "—", s.bestDay && s.bestDay.sum >= 0 ? "pos" : ""),
      metric("วันที่แย่ที่สุด", s.worstDay ? `${s.worstDay.key} (${fmtMoney(s.worstDay.sum)})` : "—", s.worstDay && s.worstDay.sum < 0 ? "neg" : ""),
    ].join("");

    document.getElementById("radarChartWrap").innerHTML = buildRadarChart(s);
    document.getElementById("equityChartWrap").innerHTML = buildEquityCurveSvg();
    document.getElementById("monthlyChartWrap").innerHTML = buildMonthlyBarChart();
  }

  function buildEquityCurveSvg() {
    if (!trades.length) return '<div class="empty">ยังไม่มีข้อมูลเทรด</div>';
    const sorted = [...trades].sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
    let cum = 0;
    const points = sorted.map(t => { cum += Number(t.pnl) || 0; return cum; });

    const w = 900, h = 260, padL = 60, padR = 20, padT = 20, padB = 30;
    const minV = Math.min(0, ...points);
    const maxV = Math.max(0, ...points);
    const range = (maxV - minV) || 1;
    const xStep = points.length > 1 ? (w - padL - padR) / (points.length - 1) : 0;
    const xAt = i => padL + i * xStep;
    const yAt = v => padT + (h - padT - padB) * (1 - (v - minV) / range);
    const zeroY = yAt(0);
    const pathPts = points.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(" ");
    const last = points[points.length - 1];
    const lineColor = last >= 0 ? "var(--bull)" : "var(--bear)";

    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="260" preserveAspectRatio="none">
      <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" style="stroke:var(--border)" stroke-dasharray="4 4"/>
      <text x="${padL - 8}" y="${zeroY.toFixed(1)}" font-size="10" text-anchor="end" dy="4" style="fill:var(--muted)">0</text>
      <text x="${padL - 8}" y="${padT}" font-size="10" text-anchor="end" dy="4" style="fill:var(--muted)">${maxV.toFixed(0)}</text>
      <text x="${padL - 8}" y="${h - padB}" font-size="10" text-anchor="end" dy="4" style="fill:var(--muted)">${minV.toFixed(0)}</text>
      <polyline points="${pathPts}" fill="none" style="stroke:${lineColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${xAt(points.length - 1).toFixed(1)}" cy="${yAt(last).toFixed(1)}" r="4" style="fill:${lineColor}"/>
      <text x="${padL}" y="${h - 8}" font-size="11" style="fill:var(--muted)">${sorted[0].date}</text>
      <text x="${w - padR}" y="${h - 8}" font-size="11" text-anchor="end" style="fill:var(--muted)">${sorted[sorted.length - 1].date}</text>
    </svg>`;
  }

  function buildMonthlyBarChart() {
    if (!trades.length) return '<div class="empty">ยังไม่มีข้อมูลเทรด</div>';
    const now = new Date();
    const months = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ y: d.getFullYear(), m: d.getMonth(), total: 0 });
    }
    trades.forEach(t => {
      const [y, m] = t.date.split("-").map(Number);
      const bucket = months.find(mo => mo.y === y && mo.m === (m - 1));
      if (bucket) bucket.total += Number(t.pnl) || 0;
    });
    const maxAbs = Math.max(1, ...months.map(m => Math.abs(m.total)));

    return `<div class="bar-chart">` + months.map(mo => {
      const pct = Math.max(2, Math.round((Math.abs(mo.total) / maxAbs) * 100));
      const cls = mo.total > 0 ? "pos" : mo.total < 0 ? "neg" : "";
      return `<div class="bar-col">
        <div class="bar-track"><div class="bar-fill ${cls}" style="height:${pct}%${cls ? "" : ";background:var(--border)"}"></div></div>
        <div class="bar-label">${MONTH_SHORT_TH[mo.m]} ${String(mo.y).slice(2)}</div>
        <div class="bar-value mono ${cls}">${fmtMoney(mo.total)}</div>
      </div>`;
    }).join("") + `</div>`;
  }

  /* ---------- trade log ---------- */
  document.getElementById("logMarketFilter").addEventListener("change", renderLog);

  function renderLog() {
    const marketFilter = document.getElementById("logMarketFilter").value;

    let list = [...trades];
    if (marketFilter) list = list.filter(t => t.marketType === marketFilter);
    list.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));

    const wrap = document.getElementById("logTableWrap");
    if (!list.length) {
      wrap.innerHTML = '<div class="empty">ยังไม่มีรายการเทรดที่ตรงเงื่อนไข</div>';
      return;
    }

    wrap.innerHTML = `<div class="table-scroll"><table>
      <thead><tr>
        <th>วันที่</th><th>ตลาด</th><th>สัญลักษณ์</th><th>ทิศทาง</th><th>กำไร/ขาดทุน</th><th>แท็ก</th>
      </tr></thead>
      <tbody>
        ${list.map(t => `
          <tr class="trade-row" data-id="${t.id}">
            <td class="mono">${t.date}</td>
            <td><span class="badge market">${MARKET_LABEL[t.marketType] || t.marketType}</span></td>
            <td><div class="row-symbol">${(t.imageAfter || t.imageBefore || t.image) ? `<img class="row-thumb" src="${t.imageAfter || t.imageBefore || t.image}">` : ""}${escapeHtml(t.symbol || "—")}</div></td>
            <td><span class="badge ${t.side === "long" ? "up" : "down"}">${t.side === "long" ? "BUY" : "SELL"}</span></td>
            <td class="mono" style="color:${Number(t.pnl) >= 0 ? "var(--bull)" : "var(--bear)"}">${fmtMoney(t.pnl)}</td>
            <td>${(t.tags || []).map(tag => `<span class="tag-chip">${escapeHtml(tag)}</span>`).join("")}</td>
          </tr>
        `).join("")}
      </tbody>
    </table></div>`;

    wrap.querySelectorAll(".trade-row").forEach(row => {
      row.addEventListener("click", () => openTradeModal(row.dataset.id));
    });
  }

  /* ---------- add/edit trade modal ---------- */
  const tradeModal = document.getElementById("tradeModal");
  const tfMarketType = document.getElementById("tfMarketType");
  let editingId = null;
  let currentSide = "long";
  let currentImageBefore = null;
  let currentImageAfter = null;
  let currentGrade = null;

  function toggleMarketFields() {
    const type = tfMarketType.value;
    document.getElementById("tfForexFields").classList.toggle("hidden", type !== "forex");
    document.getElementById("tfFuturesFields").classList.toggle("hidden", type !== "futures");
    document.getElementById("tfSymbolLabel").textContent =
      type === "forex" ? "คู่เงิน" : type === "futures" ? "สัญญา / Ticker" : "สัญลักษณ์";
    document.getElementById("tfSymbol").placeholder =
      type === "forex" ? "เช่น EUR/USD" : type === "futures" ? "เช่น ES, NQ, GC" : "เช่น AAPL, BTC/USD";
  }
  tfMarketType.addEventListener("change", toggleMarketFields);

  function updateSideToggle() {
    document.querySelectorAll(".side-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.side === currentSide);
    });
  }
  document.querySelectorAll(".side-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentSide = btn.dataset.side;
      updateSideToggle();
    });
  });

  function updateGradeToggle() {
    document.querySelectorAll("#tfGradeToggle .grade-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.grade === currentGrade);
    });
  }
  document.querySelectorAll("#tfGradeToggle .grade-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentGrade = (btn.dataset.grade === currentGrade) ? null : btn.dataset.grade;
      updateGradeToggle();
    });
  });

  function wireImageField(inputId, previewWrapId, labelTextId, getImage, setImage) {
    function render() {
      const wrap = document.getElementById(previewWrapId);
      const labelText = document.getElementById(labelTextId);
      labelText.textContent = getImage() ? "เปลี่ยนรูปภาพ" : "+ เพิ่มรูปภาพ";
      wrap.innerHTML = getImage()
        ? `<div class="image-preview-item"><img src="${getImage()}"><button type="button" class="img-remove-btn">ลบรูปนี้</button></div>`
        : "";
      const removeBtn = wrap.querySelector(".img-remove-btn");
      if (removeBtn) removeBtn.addEventListener("click", () => { setImage(null); render(); });
    }
    document.getElementById(inputId).addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setImage(await resizeImageToDataUrl(file, 1000));
      render();
    });
    return render;
  }
  const renderImageBeforePreview = wireImageField(
    "tfImageBeforeInput", "tfImageBeforePreview", "tfImageBeforeLabelText",
    () => currentImageBefore, (v) => { currentImageBefore = v; }
  );
  const renderImageAfterPreview = wireImageField(
    "tfImageAfterInput", "tfImageAfterPreview", "tfImageAfterLabelText",
    () => currentImageAfter, (v) => { currentImageAfter = v; }
  );

  function openTradeModal(id, prefillDate) {
    editingId = id || null;
    const t = editingId ? trades.find(x => x.id === editingId) : null;

    document.getElementById("tradeModalTitle").textContent = t ? "แก้ไขเทรด" : "เพิ่มเทรดใหม่";
    document.getElementById("tradeDeleteBtn").classList.toggle("hidden", !t);

    document.getElementById("tfDate").value = t ? t.date : (prefillDate || todayKey());
    tfMarketType.value = t ? t.marketType : "forex";
    document.getElementById("tfSymbol").value = t ? (t.symbol || "") : "";
    currentSide = t ? t.side : "long";
    updateSideToggle();
    document.getElementById("tfLot").value = t && t.lot != null ? t.lot : "";
    document.getElementById("tfPips").value = t && t.pips != null ? t.pips : "";
    document.getElementById("tfContracts").value = t && t.contracts != null ? t.contracts : "";
    document.getElementById("tfPoints").value = t && t.points != null ? t.points : "";
    document.getElementById("tfEntry").value = t && t.entry != null ? t.entry : "";
    document.getElementById("tfExit").value = t && t.exit != null ? t.exit : "";
    document.getElementById("tfPnl").value = t ? t.pnl : "";
    document.getElementById("tfSession").value = t ? (t.session || "") : "";
    document.getElementById("tfAccount").value = t ? (t.account || "") : "";
    document.getElementById("tfModel").value = t ? (t.model || "") : "";
    document.getElementById("tfFollowedRules").checked = t ? !!t.followedRules : false;
    document.getElementById("tfBreakeven").checked = t ? !!t.breakeven : false;
    document.getElementById("tfEntryWindow").checked = t ? !!t.enteredWindow : false;
    document.getElementById("tfTags").value = t ? (t.tags || []).join(", ") : "";
    document.getElementById("tfNegTags").value = t ? (t.negTags || []).join(", ") : "";
    document.getElementById("tfTvLink").value = t ? (t.tvLink || "") : "";
    document.getElementById("tfNotes").value = t ? (t.notes || "") : "";
    currentImageBefore = t ? (t.imageBefore || null) : null;
    currentImageAfter = t ? (t.imageAfter || t.image || null) : null; // t.image = legacy single-image field
    renderImageBeforePreview();
    renderImageAfterPreview();
    currentGrade = t ? (t.grade || null) : null;
    updateGradeToggle();

    toggleMarketFields();
    tradeModal.classList.add("open");
  }
  function closeTradeModal() {
    tradeModal.classList.remove("open");
    editingId = null;
  }

  document.getElementById("addTradeBtn").addEventListener("click", () => openTradeModal(null));
  document.getElementById("tradeModalClose").addEventListener("click", closeTradeModal);
  document.getElementById("tradeCancelBtn").addEventListener("click", closeTradeModal);
  tradeModal.addEventListener("click", (e) => { if (e.target === tradeModal) closeTradeModal(); });

  document.getElementById("tradeSaveBtn").addEventListener("click", () => {
    const date = document.getElementById("tfDate").value;
    const pnlRaw = document.getElementById("tfPnl").value;
    if (!date) { alert("กรุณาเลือกวันที่"); return; }
    if (pnlRaw === "" || isNaN(Number(pnlRaw))) { alert("กรุณาใส่กำไร/ขาดทุน ($) เป็นตัวเลข"); return; }

    const marketType = tfMarketType.value;
    const tags = document.getElementById("tfTags").value
      .split(",").map(s => s.trim()).filter(Boolean);
    const negTags = document.getElementById("tfNegTags").value
      .split(",").map(s => s.trim()).filter(Boolean);

    const record = {
      id: editingId || uid(),
      date,
      marketType,
      symbol: document.getElementById("tfSymbol").value.trim(),
      side: currentSide,
      lot: marketType === "forex" && document.getElementById("tfLot").value !== "" ? Number(document.getElementById("tfLot").value) : null,
      pips: marketType === "forex" && document.getElementById("tfPips").value !== "" ? Number(document.getElementById("tfPips").value) : null,
      contracts: marketType === "futures" && document.getElementById("tfContracts").value !== "" ? Number(document.getElementById("tfContracts").value) : null,
      points: marketType === "futures" && document.getElementById("tfPoints").value !== "" ? Number(document.getElementById("tfPoints").value) : null,
      entry: document.getElementById("tfEntry").value !== "" ? Number(document.getElementById("tfEntry").value) : null,
      exit: document.getElementById("tfExit").value !== "" ? Number(document.getElementById("tfExit").value) : null,
      pnl: Number(pnlRaw),
      session: document.getElementById("tfSession").value,
      account: document.getElementById("tfAccount").value.trim(),
      model: document.getElementById("tfModel").value.trim(),
      grade: currentGrade,
      followedRules: document.getElementById("tfFollowedRules").checked,
      breakeven: document.getElementById("tfBreakeven").checked,
      enteredWindow: document.getElementById("tfEntryWindow").checked,
      tags,
      negTags,
      imageBefore: currentImageBefore,
      imageAfter: currentImageAfter,
      tvLink: document.getElementById("tfTvLink").value.trim(),
      notes: document.getElementById("tfNotes").value.trim(),
      createdAt: editingId ? (trades.find(x => x.id === editingId) || {}).createdAt || Date.now() : Date.now(),
    };

    if (editingId) {
      trades = trades.map(t => t.id === editingId ? record : t);
    } else {
      trades.push(record);
    }
    saveTrades();
    closeTradeModal();
    renderCalendar();
    renderLog();
  });

  document.getElementById("tradeDeleteBtn").addEventListener("click", () => {
    if (!editingId) return;
    if (confirm("ลบเทรดนี้หรือไม่?")) {
      trades = trades.filter(t => t.id !== editingId);
      saveTrades();
      closeTradeModal();
      renderCalendar();
      renderLog();
    }
  });

  /* ---------- export / import ---------- */
  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  document.getElementById("exportBtn").addEventListener("click", () => {
    const payload = { version: 1, exportedAt: new Date().toISOString(), trades };
    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    triggerDownload(blob, `trade-journal-backup-${todayKey()}.json`);
  });

  const importInput = document.getElementById("importInput");
  document.getElementById("importBtn").addEventListener("click", () => importInput.click());
  importInput.addEventListener("change", async () => {
    const file = importInput.files[0];
    importInput.value = "";
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if (!parsed || !Array.isArray(parsed.trades)) { alert("รูปแบบไฟล์ไม่ถูกต้อง"); return; }
      const imported = parsed.trades.map(t => ({ ...t, id: uid() }));
      trades = trades.concat(imported);
      saveTrades();
      renderCalendar();
      renderLog();
      alert(`นำเข้าเรียบร้อย ${imported.length} รายการ`);
    } catch (err) {
      console.error(err);
      alert("นำเข้าข้อมูลไม่สำเร็จ ไฟล์อาจเสียหายหรือไม่ใช่ไฟล์สำรองที่ถูกต้อง");
    }
  });

  /* ---------- init ---------- */
  toggleMarketFields();
  updateSideToggle();
  renderCalendar();
})();
</script>
</body>
</html>
