<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แนวข้อสอบการพัฒนาระบบงานคอมพิวเตอร์ 30 ข้อ</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card-bg: #ffffff;
    --text: #1f2430;
    --muted: #667085;
    --primary: #2d5cf6;
    --correct: #1a9d5a;
    --incorrect: #e5484d;
    --border: #e3e7ee;
    --header-bg: #1c2333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Sarabun", "TH Sarabun New", "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 60px;
  }
  header {
    background: var(--header-bg);
    color: #fff;
    padding: 22px 20px;
    text-align: center;
  }
  header .back-row { text-align: left; max-width: 800px; margin: 0 auto 12px; }
  header .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: #b9c0d4; text-decoration: none; font-size: 0.85rem;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 999px; padding: 6px 13px;
  }
  header .back-link:hover { color: #fff; border-color: #fff; }
  header h1 { margin: 0 0 6px; font-size: 1.5rem; }
  header p { margin: 0; color: #b9c0d4; font-size: 0.95rem; }

  .container { max-width: 800px; margin: 0 auto; padding: 20px; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .toolbar button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .toolbar button.secondary {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  #score-box {
    font-weight: 600;
    color: var(--muted);
  }
  #score-box span { color: var(--primary); font-size: 1.1rem; }

  .question-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .q-number {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    font-weight: 600;
    font-size: 0.8rem;
    padding: 2px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .q-prompt { font-size: 1.02rem; font-weight: 600; margin: 0 0 12px; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .option:hover { background: #f0f3fc; }
  .option input { margin-top: 3px; }
  .option.correct { border-color: var(--correct); background: #eafaf1; }
  .option.incorrect { border-color: var(--incorrect); background: #fdeeee; }
  .option.disabled { pointer-events: none; }

  .explanation {
    display: none;
    margin-top: 12px;
    padding: 10px 14px;
    background: #f4f6fa;
    border-left: 4px solid var(--primary);
    border-radius: 6px;
    font-size: 0.92rem;
    color: var(--muted);
  }
  .explanation.show { display: block; }
  .explanation b { color: var(--text); }

  .verdict {
    display: none;
    font-weight: 700;
    margin-top: 10px;
    font-size: 0.95rem;
  }
  .verdict.correct-v { color: var(--correct); display: block; }
  .verdict.incorrect-v { color: var(--incorrect); display: block; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 20px;
  }

  #result-summary {
    display: none;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  #result-summary.show { display: block; }
  #result-summary .big-score { font-size: 2.2rem; font-weight: 700; color: var(--primary); }
</style>
</head>
<body>

<header>
  <div class="back-row"><a class="back-link" href="quiz.html">‹ กลับหน้าแบบทดสอบ</a></div>
  <h1>แนวข้อสอบ: ความรู้เรื่องการพัฒนาระบบงานคอมพิวเตอร์</h1>
  <p>30 ข้อ พร้อมเฉลยและคำอธิบาย — SDLC, การวิเคราะห์ออกแบบระบบ, ฐานข้อมูล, การเขียนโปรแกรม, เว็บแอปพลิเคชัน</p>
</header>

<div class="container">
  <div class="toolbar">
    <div id="score-box">ตอบแล้ว <span id="answered-count">0</span>/30</div>
    <div>
      <button class="secondary" onclick="resetQuiz()">เริ่มใหม่</button>
      <button onclick="checkAll()">ตรวจทั้งหมด</button>
    </div>
  </div>

  <div id="result-summary">
    <div>คะแนนของคุณ</div>
    <div class="big-score"><span id="final-score">0</span> / 30</div>
  </div>

  <div id="quiz-root"></div>
</div>

<footer>สร้างขึ้นเพื่อการฝึกทบทวนเท่านั้น ไม่ใช่ข้อสอบจริงของศาลยุติธรรม</footer>

<script>
const questions = [
  {q:"SDLC ย่อมาจากอะไร", options:["System Development Life Cycle","Software Design Language Code","System Data Link Control","Standard Development Level Check"], correct:0, explain:"SDLC คือ System (หรือ Software) Development Life Cycle หมายถึงวงจรการพัฒนาระบบงาน/ซอฟต์แวร์ ตั้งแต่เริ่มต้นจนถึงบำรุงรักษา"},
  {q:"ขั้นตอนแรกของ SDLC โดยทั่วไปคือข้อใด", options:["Design (ออกแบบ)","Planning (วางแผน/สำรวจปัญหา)","Testing (ทดสอบ)","Maintenance (บำรุงรักษา)"], correct:1, explain:"ขั้นแรกของ SDLC คือ Planning หรือ System Investigation เพื่อสำรวจปัญหาและความเป็นไปได้ของโครงการก่อนเริ่มวิเคราะห์ระบบ"},
  {q:"แบบจำลอง Waterfall Model มีลักษณะเด่นคือข้อใด", options:["ทำงานแบบวนซ้ำได้ตลอดโครงการ","แต่ละขั้นตอนต้องเสร็จก่อนจึงจะเริ่มขั้นถัดไปตามลำดับ","ไม่มีขั้นตอนการทดสอบ","เหมาะกับระบบที่เปลี่ยนความต้องการบ่อย"], correct:1, explain:"Waterfall Model เป็นแบบจำลองเชิงเส้นตรง (sequential) ที่แต่ละขั้นตอนต้องเสร็จสมบูรณ์ก่อนจึงจะเริ่มขั้นตอนถัดไป เหมาะกับระบบที่ความต้องการชัดเจนและไม่เปลี่ยนแปลงบ่อย"},
  {q:"Prototyping Model มีจุดประสงค์หลักคือข้อใด", options:["สร้างต้นแบบให้ผู้ใช้ทดลองและให้ข้อเสนอแนะก่อนพัฒนาระบบจริง","ลดขั้นตอนการทดสอบระบบ","ใช้แทนการเขียนเอกสารทั้งหมด","ใช้ได้เฉพาะระบบขนาดใหญ่เท่านั้น"], correct:0, explain:"Prototyping Model สร้างต้นแบบ (prototype) ของระบบให้ผู้ใช้ได้ทดลองใช้งานและให้ข้อเสนอแนะ เพื่อปรับปรุงความต้องการให้ชัดเจนก่อนพัฒนาระบบจริง"},
  {q:"แนวคิดหลักของ Agile Software Development คือข้อใด", options:["วางแผนทุกอย่างล่วงหน้าแบบตายตัวตั้งแต่ต้น","พัฒนาระบบเป็นรอบสั้น ๆ (iteration) และปรับเปลี่ยนตามความต้องการที่เปลี่ยนแปลง","ห้ามลูกค้ามีส่วนร่วมระหว่างการพัฒนา","ต้องเขียนเอกสารให้ครบถ้วนก่อนเขียนโค้ดเสมอ"], correct:1, explain:"Agile เน้นการพัฒนาเป็นรอบสั้น ๆ (iterative) ตอบสนองต่อการเปลี่ยนแปลงความต้องการได้รวดเร็ว และให้ลูกค้ามีส่วนร่วมตลอดกระบวนการ"},
  {q:"ในกระบวนการ Scrum ช่วงเวลาทำงานเป็นรอบสั้น ๆ (ปกติ 1-4 สัปดาห์) เรียกว่าอะไร", options:["Sprint","Backlog","Milestone","Release"], correct:0, explain:"Sprint คือช่วงเวลาทำงานรอบหนึ่งใน Scrum ปกติยาว 1-4 สัปดาห์ เพื่อส่งมอบงานที่ใช้งานได้เป็นชิ้น ๆ"},
  {q:"Data Flow Diagram (DFD) ใช้สำหรับอะไร", options:["แสดงโครงสร้างฐานข้อมูล","แสดงการไหลของข้อมูลระหว่างกระบวนการ แหล่งข้อมูล และผู้ใช้ในระบบ","แสดงลำดับเวลาการพัฒนาโครงการ","แสดงโครงสร้างองค์กร"], correct:1, explain:"DFD เป็นแผนภาพที่แสดงการไหลของข้อมูล (data flow) ระหว่างกระบวนการ (process), แหล่งข้อมูลภายนอก (external entity) และที่เก็บข้อมูล (data store) ในระบบ"},
  {q:"ER Diagram (Entity-Relationship Diagram) ใช้สำหรับอะไร", options:["ออกแบบหน้าจอผู้ใช้งาน","แสดงความสัมพันธ์ระหว่างเอนทิตี (entity) ในการออกแบบฐานข้อมูล","เขียนผังงานโปรแกรม","จัดตารางเวลาโครงการ"], correct:1, explain:"ER Diagram ใช้แสดงเอนทิตีและความสัมพันธ์ระหว่างเอนทิตีต่าง ๆ เป็นเครื่องมือสำคัญในการออกแบบโครงสร้างฐานข้อมูลเชิงสัมพันธ์"},
  {q:"Primary Key ในฐานข้อมูลหมายถึงอะไร", options:["ฟิลด์ที่ใช้เชื่อมโยงไปยังตารางอื่น", "ฟิลด์หรือกลุ่มฟิลด์ที่ใช้ระบุแถวข้อมูลแต่ละแถวได้อย่างไม่ซ้ำกัน","ฟิลด์ที่เก็บรหัสผ่าน","ฟิลด์ที่ไม่บังคับกรอกข้อมูล"], correct:1, explain:"Primary Key คือฟิลด์หรือกลุ่มฟิลด์ที่ใช้ระบุความเป็นเอกลักษณ์ (unique) ของแต่ละแถวในตาราง ห้ามซ้ำและห้ามเป็นค่าว่าง"},
  {q:"Foreign Key มีหน้าที่หลักคือข้อใด", options:["เข้ารหัสข้อมูลในตาราง","เชื่อมโยงความสัมพันธ์ระหว่างตารางสองตารางเข้าด้วยกัน","กำหนดสิทธิ์การเข้าถึงข้อมูล","เพิ่มความเร็วในการค้นหาข้อมูลเสมอ"], correct:1, explain:"Foreign Key คือฟิลด์ในตารางหนึ่งที่อ้างอิงไปยัง Primary Key ของอีกตารางหนึ่ง ใช้สร้างความสัมพันธ์ (relationship) ระหว่างตาราง"},
  {q:"วัตถุประสงค์หลักของการทำ Normalization ในฐานข้อมูลคือข้อใด", options:["เพิ่มความซ้ำซ้อนของข้อมูลเพื่อความปลอดภัย","ลดความซ้ำซ้อนของข้อมูลและป้องกันปัญหาความผิดปกติ (Anomaly) ในการเพิ่ม/ลบ/แก้ไขข้อมูล","เพิ่มจำนวนตารางให้มากที่สุด","ทำให้ฐานข้อมูลทำงานช้าลง"], correct:1, explain:"Normalization คือกระบวนการจัดโครงสร้างตารางฐานข้อมูลเพื่อลดความซ้ำซ้อนของข้อมูล (data redundancy) และป้องกันปัญหา Insert/Update/Delete Anomaly"},
  {q:"คำสั่ง SQL ใดใช้สำหรับดึงข้อมูลจากตาราง", options:["INSERT","UPDATE","SELECT","DELETE"], correct:2, explain:"คำสั่ง SELECT ใช้สำหรับดึง (query) ข้อมูลจากตารางในฐานข้อมูล เป็นคำสั่งพื้นฐานที่ใช้บ่อยที่สุดใน SQL"},
  {q:"คำสั่ง SQL ใดใช้สำหรับเพิ่มข้อมูลใหม่เข้าไปในตาราง", options:["SELECT","INSERT","UPDATE","DROP"], correct:1, explain:"คำสั่ง INSERT INTO ใช้สำหรับเพิ่มแถวข้อมูลใหม่เข้าไปในตารางของฐานข้อมูล"},
  {q:"DBMS ย่อมาจากอะไร และหมายถึงอะไร", options:["Data Backup Management System - ระบบสำรองข้อมูล","Database Management System - ซอฟต์แวร์จัดการฐานข้อมูล","Digital Business Management Software - ซอฟต์แวร์บริหารธุรกิจ","Data Block Memory Storage - หน่วยเก็บข้อมูล"], correct:1, explain:"DBMS คือ Database Management System หมายถึงซอฟต์แวร์ที่ใช้จัดการฐานข้อมูล เช่น การสร้าง เข้าถึง แก้ไข และควบคุมความปลอดภัยของข้อมูล เช่น MySQL, Oracle, SQL Server"},
  {q:"ข้อใดอธิบายความแตกต่างระหว่าง Compiler และ Interpreter ได้ถูกต้อง", options:["Compiler แปลโค้ดทีละบรรทัดขณะรัน ส่วน Interpreter แปลทั้งโปรแกรมก่อนรัน","Compiler แปลโค้ดทั้งโปรแกรมเป็นไฟล์ executable ก่อนรัน ส่วน Interpreter แปลและทำงานทีละบรรทัดขณะรันโปรแกรม","ทั้งสองแบบทำงานเหมือนกันทุกประการ","Interpreter ใช้ได้เฉพาะภาษา Assembly เท่านั้น"], correct:1, explain:"Compiler จะแปล (compile) ซอร์สโค้ดทั้งหมดเป็นไฟล์ executable ก่อนแล้วจึงรัน ส่วน Interpreter จะแปลและประมวลผลคำสั่งทีละบรรทัดขณะรันโปรแกรม (เช่น Python)"},
  {q:"ในแนวคิด OOP (Object-Oriented Programming) 'Class' หมายถึงอะไร", options:["ตัวแปรชนิดหนึ่ง","พิมพ์เขียวหรือแม่แบบที่ใช้สร้าง Object","ชื่อของฟังก์ชันในโปรแกรม","คำสั่งควบคุมการวนซ้ำ"], correct:1, explain:"Class คือพิมพ์เขียว (blueprint) หรือแม่แบบที่กำหนดคุณสมบัติ (attribute) และพฤติกรรม (method) ซึ่งใช้สร้าง Object ขึ้นมา"},
  {q:"Encapsulation ในหลักการ OOP หมายถึงอะไร", options:["การซ่อนรายละเอียดการทำงานภายในและควบคุมการเข้าถึงข้อมูลผ่าน method ที่กำหนด","การให้ Class หนึ่งสืบทอดคุณสมบัติจาก Class อื่น","การที่ Object ต่างชนิดตอบสนองต่อคำสั่งเดียวกันต่างกัน","การเขียนโค้ดซ้ำหลายครั้ง"], correct:0, explain:"Encapsulation คือการห่อหุ้มข้อมูลและซ่อนรายละเอียดการทำงานภายใน (data hiding) โดยให้เข้าถึงข้อมูลผ่าน method ที่กำหนดไว้เท่านั้น"},

const userAnswers = new Array(questions.length).fill(null);
const answeredLocked = new Array(questions.length).fill(false);

const root = document.getElementById('quiz-root');

function render() {
  root.innerHTML = '';
  questions.forEach((item, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';

    const num = document.createElement('div');
    num.className = 'q-number';
    num.textContent = 'ข้อ ' + (qi + 1) + ' / ' + questions.length;
    card.appendChild(num);

    const prompt = document.createElement('p');
    prompt.className = 'q-prompt';
    prompt.textContent = item.q;
    card.appendChild(prompt);

    const optWrap = document.createElement('div');
    optWrap.className = 'options';

    item.options.forEach((optText, oi) => {
      const label = document.createElement('label');
      label.className = 'option';
      label.id = 'opt-' + qi + '-' + oi;

      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + qi;
      input.value = oi;
      input.onchange = () => selectAnswer(qi, oi);

      const span = document.createElement('span');
      span.textContent = optText;

      label.appendChild(input);
      label.appendChild(span);
      optWrap.appendChild(label);
    });

    card.appendChild(optWrap);

    const verdict = document.createElement('div');
    verdict.className = 'verdict';
    verdict.id = 'verdict-' + qi;
    card.appendChild(verdict);

    const explain = document.createElement('div');
    explain.className = 'explanation';
    explain.id = 'explain-' + qi;
    explain.innerHTML = '<b>เฉลย: </b>' + item.options[item.correct] + '<br>' + item.explain;
    card.appendChild(explain);

    root.appendChild(card);
  });
  updateScoreBox();
}

function selectAnswer(qi, oi) {
  if (answeredLocked[qi]) return;
  userAnswers[qi] = oi;
  lockQuestion(qi);
}

function lockQuestion(qi) {
  answeredLocked[qi] = true;
  const item = questions[qi];
  const chosen = userAnswers[qi];

  item.options.forEach((_, oi) => {
    const label = document.getElementById('opt-' + qi + '-' + oi);
    label.classList.add('disabled');
    if (oi === item.correct) label.classList.add('correct');
    if (oi === chosen && chosen !== item.correct) label.classList.add('incorrect');
  });

  const verdict = document.getElementById('verdict-' + qi);
  if (chosen === item.correct) {
    verdict.textContent = '✓ ถูกต้อง';
    verdict.className = 'verdict correct-v';
  } else {
    verdict.textContent = '✗ ยังไม่ถูก';
    verdict.className = 'verdict incorrect-v';
  }

  document.getElementById('explain-' + qi).classList.add('show');
  updateScoreBox();
}

function checkAll() {
  questions.forEach((_, qi) => {
    if (!answeredLocked[qi]) {
      const checked = document.querySelector('input[name="q' + qi + '"]:checked');
      if (checked) {
        userAnswers[qi] = parseInt(checked.value);
      }
      lockQuestion(qi);
    }
  });
  showSummary();
}

function updateScoreBox() {
  const answeredCount = answeredLocked.filter(Boolean).length;
  document.getElementById('answered-count').textContent = answeredCount;
}

function showSummary() {
  let score = 0;
  questions.forEach((item, qi) => {
    if (userAnswers[qi] === item.correct) score++;
  });
  document.getElementById('final-score').textContent = score;
  document.getElementById('result-summary').classList.add('show');
  document.getElementById('result-summary').scrollIntoView({behavior: 'smooth'});
  saveQuizScore(score, questions.length);
}

/* ---------- ส่งคะแนนกลับไปให้หน้า quiz.html แสดงสรุป ----------
   ไฟล์ควิซทุกไฟล์ในระบบนี้เรียกฟังก์ชันนี้เหมือนกัน — id จะดึงจากชื่อไฟล์ตัวเองอัตโนมัติ
   (ต้องตรงกับ id ที่ประกาศไว้ใน QUIZ_SETS ของ quiz.html ซึ่งปกติจะตรงกันเองเพราะใช้ชื่อไฟล์เดียวกัน) */
function saveQuizScore(score, total) {
  try {
    const id = location.pathname.split('/').pop().replace(/\.html$/, '');
    const key = 'quiz_scores_v1';
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    const prev = all[id] || {};
    all[id] = {
      score, total,
      at: Date.now(),
      best: Math.max(score, prev.best || 0),
      bestTotal: total,
      attempts: (prev.attempts || 0) + 1,
    };
    localStorage.setItem(key, JSON.stringify(all));
  } catch (e) {}
}

function resetQuiz() {
  userAnswers.fill(null);
  answeredLocked.fill(false);
  document.getElementById('result-summary').classList.remove('show');
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

render();
</script>
