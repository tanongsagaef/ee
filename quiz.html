<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>แบบทดสอบ · Quiz Hub</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eef0f8; --surface: #ffffff; --surface-alt: #f4f5fb; --border: #e4e5f2;
    --text: #12132a; --muted: #6b6f86;
    --accent: #7c5cff; --accent-hover: #6b48ff; --accent-soft: #efeaff;
    --bull: #10b981; --bull-soft: rgba(16,185,129,0.12);
    --bear: #f43f5e; --bear-soft: rgba(244,63,94,0.12);
    --warn: #f59e0b; --warn-soft: rgba(245,158,11,0.14);
    --grad: linear-gradient(120deg, #7c5cff 0%, #b74bff 48%, #ff5ca8 100%);
    --grad-soft: linear-gradient(120deg, rgba(124,92,255,.14), rgba(255,92,168,.14));
    --shadow: 0 2px 6px rgba(20,20,60,.05), 0 14px 40px -14px rgba(60,40,160,.18);
    --shadow-lg: 0 8px 24px -6px rgba(70,40,170,.28);
    --radius: 18px; --radius-lg: 24px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0b12; --surface: #14151f; --surface-alt: #1b1d2b; --border: #282a3d;
    --text: #eef0ff; --muted: #9296b5;
    --accent: #9b83ff; --accent-hover: #b3a1ff; --accent-soft: #241f45;
    --bull: #2ee6a8; --bull-soft: rgba(46,230,168,0.14);
    --bear: #ff6b8a; --bear-soft: rgba(255,107,138,0.14);
    --warn: #ffb44d; --warn-soft: rgba(255,180,77,0.16);
    --grad: linear-gradient(120deg, #8f6bff 0%, #c65bff 48%, #ff6bb0 100%);
    --grad-soft: linear-gradient(120deg, rgba(143,107,255,.20), rgba(255,107,176,.16));
    --shadow: 0 2px 8px rgba(0,0,0,.35), 0 18px 44px -16px rgba(0,0,0,.6);
    --shadow-lg: 0 10px 30px -8px rgba(120,80,255,.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px 20px 64px;
    font-family: "Sarabun", "Noto Sans Thai", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(680px 400px at 8% -6%, rgba(124,92,255,.20), transparent 60%),
      radial-gradient(620px 420px at 100% 0%, rgba(255,92,168,.16), transparent 55%),
      radial-gradient(700px 500px at 60% 120%, rgba(56,224,255,.12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; }

  .header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: color-mix(in srgb, var(--surface) 78%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px 20px; box-shadow: var(--shadow); margin-bottom: 20px;
    position: sticky; top: 12px; z-index: 20;
  }
  .brand {
    font-size: 22px; font-weight: 900; letter-spacing: .2px; display: flex; align-items: center; gap: 9px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .dot {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--grad);
    font-size: 0; line-height: 0; flex: none;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .navlink {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 9px 15px; border-radius: 999px; font-size: 13px; text-decoration: none; font-weight: 800;
    display: inline-flex; align-items: center; gap: 6px;
    transition: transform .14s ease, box-shadow .14s ease, color .14s ease, background .14s ease, border-color .14s ease;
  }
  .navlink:hover { background: var(--grad); color: #fff; border-color: transparent; transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .navlink.plain:hover { color: #fff; }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; border-radius: 12px; cursor: pointer; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .14s ease, border-color .14s ease, color .14s ease;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

  .intro { margin: 4px 4px 20px; color: var(--muted); font-size: 13.5px; }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 4px 18px; }
  .filter-row button {
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 800; cursor: pointer; font-family: inherit;
  }
  .filter-row button.active { background: var(--grad); color: #fff; border-color: transparent; }

  .quiz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .quiz-card {
    position: relative; display: block; text-decoration: none; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .quiz-card::before {
    content: ""; position: absolute; inset: 0; background: var(--grad-soft); opacity: 0; transition: opacity .18s ease;
  }
  .quiz-card:hover { transform: translateY(-4px); border-color: transparent; box-shadow: var(--shadow-lg); }
  .quiz-card:hover::before { opacity: 1; }
  .quiz-card > * { position: relative; }
  .quiz-card .cat { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); font-weight: 900; margin-bottom: 8px; }
  .quiz-card .t { font-size: 17px; font-weight: 900; margin-bottom: 6px; }
  .quiz-card .d { font-size: 12.5px; color: var(--muted); line-height: 1.55; min-height: 38px; }
  .quiz-card .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
  .quiz-card .count { font-size: 12px; color: var(--muted); font-weight: 700; }
  .quiz-card .go { font-size: 12px; color: var(--accent); font-weight: 900; }
  .progress-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 900;
    padding: 4px 10px; border-radius: 999px; margin-top: 12px;
  }
  .progress-badge.none { background: var(--surface-alt); color: var(--muted); }
  .progress-badge.good { background: var(--bull-soft); color: var(--bull); }
  .progress-badge.mid { background: var(--warn-soft); color: var(--warn); }
  .progress-badge.low { background: var(--bear-soft); color: var(--bear); }

  .empty-state {
    background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius-lg);
    padding: 40px 24px; text-align: center; color: var(--muted); font-size: 13.5px;
  }

  @media (max-width: 640px) {
    body { padding: 12px 11px 50px; }
    .header { top: 6px; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; }
    .brand { font-size: 18px; }
    .navlink { padding: 8px 12px; font-size: 12px; }
    .quiz-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="brand"><span class="dot">◆</span> แบบทดสอบ <span class="mono" style="font-size:12px;color:var(--muted);font-weight:600;">Quiz Hub</span></div>
    <div class="row">
      <a class="navlink" href="index.html">◂ ห้องนักบิน</a>
      <button class="icon-btn" id="themeToggle" title="สลับโหมดสว่าง/มืด">◐</button>
    </div>
  </div>

  <p class="intro">รวมแบบทดสอบทุกหลักสูตร — เลือกทำได้ทุกเมื่อ คะแนนล่าสุด/สูงสุดของแต่ละหลักสูตรจะถูกจำไว้ในเครื่องนี้</p>

  <div class="filter-row" id="catFilter"></div>

  <div class="quiz-grid" id="quizGrid"></div>
</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);

  /* ---------- theme (shares tj_theme with the rest of the suite) ---------- */
  const root = document.documentElement;
  function applyTheme(t) { root.setAttribute("data-theme", t); try { localStorage.setItem("tj_theme", t); } catch (e) {} }
  applyTheme(
    (function () { try { return localStorage.getItem("tj_theme"); } catch (e) { return null; } })() ||
    (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
  );
  $("themeToggle").addEventListener("click", () => applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"));

  /* ---------- quiz manifest ----------
     เพิ่มหลักสูตรใหม่: สร้างไฟล์ quiz-<ชื่อ>.html (ก๊อปจาก quiz-network-30.html เป็นต้นแบบ
     แล้วแก้ตัวแปร questions[] + หัวข้อ) แล้วเติม entry ใหม่ในลิสต์ด้านล่างนี้ ไม่ต้องแก้ไฟล์อื่น
     — ไฟล์ควิซแต่ละไฟล์บันทึกคะแนนเองผ่าน saveQuizScore(id, score, total) ลง
     localStorage key "quiz_scores_v1" โดย id ต้องตรงกับ id ที่ประกาศไว้ที่นี่ */
  const QUIZ_SETS = [
    {
      id: "quiz-network-30",
      file: "quiz-network-30.html",
      title: "เครือข่ายคอมพิวเตอร์ (Network)",
      desc: "OSI 7 ชั้น, TCP/IP, อุปกรณ์เครือข่าย, โทโพโลยี, โปรโตคอลพื้นฐาน",
      count: 30,
      category: "IT พื้นฐาน",
    },
    {
      id: "quiz-system-development-30",
      file: "quiz-system-development-30.html",
      title: "การพัฒนาระบบงานคอมพิวเตอร์",
      desc: "SDLC, การวิเคราะห์ออกแบบระบบ, ฐานข้อมูล, OOP, การทดสอบระบบ, เว็บแอปพลิเคชัน",
      count: 30,
      category: "การพัฒนาระบบ",
    },
    {
      id: "quiz-programming-operators-loops-30",
      file: "quiz-programming-operators-loops-30.html",
      title: "การเขียนโปรแกรม: Operator เงื่อนไข และ Loop",
      desc: "Operator/Increment, if-else/switch, ternary, for/while/do-while, break/continue, nested loop",
      count: 33,
      category: "การเขียนโปรแกรม",
    },
    {
      id: "quiz-general-computer-hardware-30",
      file: "quiz-general-computer-hardware-30.html",
      title: "ความรู้เกี่ยวกับคอมพิวเตอร์ทั่วไปและอุปกรณ์",
      desc: "องค์ประกอบระบบคอมพิวเตอร์, ฮาร์ดแวร์, CPU/หน่วยความจำ, อุปกรณ์นำเข้า/แสดงผล, ซอฟต์แวร์",
      count: 32,
      category: "IT พื้นฐาน",
    },
    {
      id: "quiz-cybersecurity-30",
      file: "quiz-cybersecurity-30.html",
      title: "ความมั่นคงปลอดภัยไซเบอร์",
      desc: "CIA Triad, มัลแวร์, Phishing/Social Engineering, การเข้ารหัส, การโจมตีทางไซเบอร์, พ.ร.บ.คอมพิวเตอร์/ไซเบอร์/PDPA",
      count: 30,
      category: "ความปลอดภัยไซเบอร์",
    },
  ];

  function loadScores() {
    try { return JSON.parse(localStorage.getItem("quiz_scores_v1") || "{}") || {}; } catch (e) { return {}; }
  }

  function progressBadge(rec) {
    if (!rec || !rec.attempts) return `<span class="progress-badge none">ยังไม่เคยทำ</span>`;
    const pct = rec.bestTotal ? Math.round((rec.best / rec.bestTotal) * 100) : 0;
    const cls = pct >= 80 ? "good" : pct >= 50 ? "mid" : "low";
    const lastPct = rec.total ? Math.round((rec.score / rec.total) * 100) : 0;
    return `<span class="progress-badge ${cls}">🏆 สูงสุด ${rec.best}/${rec.bestTotal} (${pct}%)</span>
      <div class="muted-note" style="font-size:11px;color:var(--muted);margin-top:6px;">ล่าสุด ${rec.score}/${rec.total} (${lastPct}%) · ทำไปแล้ว ${rec.attempts} ครั้ง</div>`;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  let activeCat = "all";

  function renderFilters() {
    const cats = ["all", ...new Set(QUIZ_SETS.map(q => q.category))];
    $("catFilter").innerHTML = cats.map(c =>
      `<button data-c="${escapeHtml(c)}" class="${c === activeCat ? "active" : ""}">${c === "all" ? "ทั้งหมด" : escapeHtml(c)}</button>`
    ).join("");
    $("catFilter").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      activeCat = b.dataset.c;
      renderFilters();
      renderGrid();
    }));
  }

  function renderGrid() {
    const scores = loadScores();
    const list = activeCat === "all" ? QUIZ_SETS : QUIZ_SETS.filter(q => q.category === activeCat);
    if (!list.length) {
      $("quizGrid").innerHTML = `<div class="empty-state">ยังไม่มีแบบทดสอบในหมวดนี้</div>`;
      return;
    }
    $("quizGrid").innerHTML = list.map(q => `
      <a class="quiz-card" href="${escapeHtml(q.file)}">
        <div class="cat">${escapeHtml(q.category)}</div>
        <div class="t">${escapeHtml(q.title)}</div>
        <div class="d">${escapeHtml(q.desc)}</div>
        <div class="meta">
          <span class="count">${q.count} ข้อ</span>
          <span class="go">เริ่มทำ →</span>
        </div>
        ${progressBadge(scores[q.id])}
      </a>
    `).join("");
  }

  if (!QUIZ_SETS.length) {
    $("quizGrid").innerHTML = `<div class="empty-state">ยังไม่มีแบบทดสอบ — เพิ่มไฟล์ quiz-*.html แล้วเติมรายการใน QUIZ_SETS</div>`;
  } else {
    renderFilters();
    renderGrid();
  }
})();
</script>

</body>
</html>
